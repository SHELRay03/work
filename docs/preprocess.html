<script>
// =============================================================
// 预处理模块 — 独立页面
// 使用 File System Access API 原地重命名文件夹与文件，仅 Chrome/Edge
// =============================================================

const TYPES = ['净版视频', 'X语压制视频', '原剧', 'YX字幕', '旁白'];
const NARR_MODES = ['Y语旁白', 'XY旁白'];
const LANGS = ['中', '英', '西', '日', '韩', '泰', '法', '德'];

const state = {
  rootHandle: null,    // 根目录 FileSystemDirectoryHandle
  childDirs: [],       // [{ handle, name }]
  configs: [],         // 与 childDirs 平行：[{ type, X, Y, narrMode }]
};

const pickDrop        = document.getElementById('pickDrop');
const pickText        = document.getElementById('pickText');
const statusPick      = document.getElementById('statusPick');
const statusCfg       = document.getElementById('statusCfg');
const cfgPanel        = document.getElementById('cfgPanel');
const dirList         = document.getElementById('dirList');
const btnRefresh      = document.getElementById('btnRefresh');
const previewPanel    = document.getElementById('previewPanel');
const previewSummary  = document.getElementById('previewSummary');
const previewDetail   = document.getElementById('previewDetail');
const btnExec         = document.getElementById('btnExec');
const btnReScan       = document.getElementById('btnReScan');
const reportPanel     = document.getElementById('reportPanel');
const reportContent   = document.getElementById('reportContent');

// 浏览器支持检查
if (!window.showDirectoryPicker) {
  pickText.textContent = '当前浏览器不支持预处理功能';
  pickDrop.style.opacity = '0.5';
  pickDrop.style.cursor = 'not-allowed';
  statusPick.className = 'status err';
  statusPick.textContent = '请使用 Chrome/Edge 浏览器，需要 File System Access API 支持。';
}

// ------- 使用某个根目录 handle（点击/拖拽共用） -------
async function useRootHandle(handle) {
  if (!handle || handle.kind !== 'directory') {
    statusPick.className = 'status err';
    statusPick.textContent = '请提供文件夹（而非单个文件）';
    return;
  }
  const perm = await handle.requestPermission?.({ mode: 'readwrite' });
  if (perm && perm !== 'granted') {
    statusPick.className = 'status err';
    statusPick.textContent = '未授权读写权限，无法执行改名';
    return;
  }
  state.rootHandle = handle;
  state.childDirs = [];
  state.configs = [];
  pickText.innerHTML = `已选择根目录：<b>${escapeHtml(handle.name)}</b>`;
  statusPick.className = 'status';
  statusPick.textContent = '扫描子目录中…';
  cfgPanel.hidden = true;
  previewPanel.hidden = true;
  reportPanel.hidden = true;
  try {
    state.childDirs = await scanChildDirs(handle);
    if (state.childDirs.length === 0) {
      statusPick.className = 'status err';
      statusPick.textContent = '根目录下未发现子文件夹';
      return;
    }
    // 默认配置：依次循环分配类型
    state.configs = state.childDirs.map((_, i) => ({
      type: TYPES[i % TYPES.length],
      X: '英',
      Y: '中',
      narrMode: 'Y语旁白',
    }));
    renderDirList();
    cfgPanel.hidden = false;
    statusPick.className = 'status ok';
    statusPick.textContent = `扫描完成：共 ${state.childDirs.length} 个子文件夹，已自动分配默认类型，请按需调整`;
  } catch (e) {
    state.rootHandle = null;
    statusPick.className = 'status err';
    statusPick.textContent = '扫描失败：' + e.message;
  }
}

// ------- 点击选择根目录 -------
pickDrop.addEventListener('click', async () => {
  if (!window.showDirectoryPicker) return;
  try {
    const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
    await useRootHandle(handle);
  } catch (e) {
    if (e.name === 'AbortError') {
      statusPick.className = 'status';
      statusPick.textContent = '已取消选择';
    } else {
      statusPick.className = 'status err';
      statusPick.textContent = '选择目录失败：' + e.message;
    }
  }
});

// ------- 拖拽选择根目录 -------
['dragenter', 'dragover'].forEach(evt => {
  pickDrop.addEventListener(evt, (e) => {
    e.preventDefault();
    e.stopPropagation();
    pickDrop.classList.add('dz-hover');
  });
});
['dragleave', 'drop'].forEach(evt => {
  pickDrop.addEventListener(evt, (e) => {
    e.preventDefault();
    e.stopPropagation();
    pickDrop.classList.remove('dz-hover');
  });
});
pickDrop.addEventListener('drop', async (e) => {
  if (!window.showDirectoryPicker) return;
  const items = e.dataTransfer?.items;
  if (!items) return;
  try {
    let dirHandle = null;
    for (const item of items) {
      const getHandle = item.getAsFileSystemHandle
        ? item.getAsFileSystemHandle()
        : null;
      if (!getHandle) continue;
      const handle = await getHandle;
      if (handle && handle.kind === 'directory') {
        dirHandle = handle;
        break;
      }
    }
    if (dirHandle) {
      await useRootHandle(dirHandle);
      return;
    }
    statusPick.className = 'status err';
    statusPick.textContent = '请拖入文件夹，而非单个文件';
  } catch (err) {
    statusPick.className = 'status err';
    statusPick.textContent = '拖入目录失败：' + (err.message || err.name);
  }
});

// ------- 扫描直接子目录 -------
async function scanChildDirs(rootHandle) {
  const dirs = [];
  for await (const entry of rootHandle.values()) {
    if (entry.kind === 'directory') {
      dirs.push({ handle: entry, name: entry.name });
    }
  }
  dirs.sort((a, b) => naturalCompare(a.name, b.name));
  return dirs;
}

function naturalCompare(a, b) {
  return String(a).localeCompare(String(b), 'zh', { numeric: true });
}

// ------- 渲染子目录归类表 -------
function renderDirList() {
  let html = `<div class="dir-head">
    <span>原文件夹名</span>
    <span>类型</span>
    <span>X 语</span>
    <span>Y 语</span>
    <span>旁白模式</span>
    <span>新文件夹名（预览）</span>
  </div>`;
  state.childDirs.forEach((d, i) => {
    const cfg = state.configs[i];
    const newName = buildFolderName(cfg);
    const typeOpts = TYPES.map(t => `<option value="${t}"${t === cfg.type ? ' selected' : ''}>${t}</option>`).join('');
    const xOpts   = LANGS.map(l => `<option value="${l}"${l === cfg.X ? ' selected' : ''}>${l}</option>`).join('');
    const yOpts   = LANGS.map(l => `<option value="${l}"${l === cfg.Y ? ' selected' : ''}>${l}</option>`).join('');
    const narrOpts = NARR_MODES.map(n => `<option value="${n}"${n === cfg.narrMode ? ' selected' : ''}>${n}</option>`).join('');
    html += `<div class="dir-row" data-idx="${i}">
      <span class="dir-old">${escapeHtml(d.name)}</span>
      <select data-field="type">${typeOpts}</select>
      <select data-field="X">${xOpts}</select>
      <select data-field="Y">${yOpts}</select>
      <select data-field="narrMode">${narrOpts}</select>
      <span class="dir-new">${escapeHtml(newName)}</span>
    </div>`;
  });
  dirList.innerHTML = html;

  // 绑定联动
  dirList.querySelectorAll('.dir-row').forEach(row => {
    const idx = parseInt(row.dataset.idx, 10);
    row.querySelectorAll('select').forEach(sel => {
      sel.addEventListener('change', () => {
        const field = sel.dataset.field;
        state.configs[idx][field] = sel.value;
        updateRowEnabled(row, state.configs[idx]);
        // 更新本行预览
        row.querySelector('.dir-new').textContent = buildFolderName(state.configs[idx]);
      });
    });
    updateRowEnabled(row, state.configs[idx]);
  });
}

function updateRowEnabled(row, cfg) {
  const xSel     = row.querySelector('select[data-field="X"]');
  const ySel     = row.querySelector('select[data-field="Y"]');
  const narrSel  = row.querySelector('select[data-field="narrMode"]');
  switch (cfg.type) {
    case '净版视频':
    case '原剧':
      xSel.disabled = ySel.disabled = narrSel.disabled = true;
      break;
    case 'X语压制视频':
      xSel.disabled = false; ySel.disabled = narrSel.disabled = true;
      break;
    case 'YX字幕':
      xSel.disabled = false; ySel.disabled = false; narrSel.disabled = true;
      break;
    case '旁白':
      xSel.disabled = false; ySel.disabled = false; narrSel.disabled = false;
      break;
  }
}

// ------- 文件夹新名生成 -------
function buildFolderName({ type, X, Y, narrMode }) {
  if (type === '净版视频') return '净版视频';
  if (type === 'X语压制视频') return X + '压制视频';
  if (type === '原剧') return '原剧';
  if (type === 'YX字幕') return Y + X + '字幕';
  // type === '旁白'
  return narrMode === 'Y语旁白' ? Y + '语旁白' : X + Y + '旁白';
}

// ------- 文件名归一化 -------
function normalizeFileName(name) {
  const dot = name.lastIndexOf('.');
  const base = dot > 0 ? name.slice(0, dot) : name;
  const ext = dot > 0 ? name.slice(dot + 1) : '';
  const m = base.match(/\d+/);
  if (!m) return name;
  const num = String(parseInt(m[0], 10));
  return ext ? num + '.' + ext : num;
}

// ------- 刷新预览（点按钮触发） -------
btnRefresh.addEventListener('click', async () => {
  if (!state.rootHandle) return;
  btnRefresh.disabled = true;
  statusCfg.className = 'status';
  statusCfg.textContent = '生成预览中…';
  try {
    const plan = await buildPlan(state.rootHandle, state.childDirs, state.configs);
    state.plan = plan;
    renderPreview(plan);
    previewPanel.hidden = false;
    reportPanel.hidden = true;
    statusCfg.className = 'status ok';
    statusCfg.textContent = '预览已刷新';
  } catch (e) {
    statusCfg.className = 'status err';
    statusCfg.textContent = '预览失败：' + e.message;
  } finally {
    btnRefresh.disabled = false;
  }
});

// ------- 构建改名计划 -------
async function buildPlan(rootHandle, childDirs, configs) {
  // 文件夹改名：原名 → 新名，检测冲突
  const folderRenames = [];
  const nameCount = new Map();
  for (let i = 0; i < childDirs.length; i++) {
    const newName = buildFolderName(configs[i]);
    folderRenames.push({
      handle: childDirs[i].handle,
      oldName: childDirs[i].name,
      newName,
      conflict: false,
    });
    nameCount.set(newName, (nameCount.get(newName) || 0) + 1);
  }
  // 标记冲突：仅保留第一个非冲突，其余 conflict=true
  const seen = new Set();
  for (const r of folderRenames) {
    if (nameCount.get(r.newName) > 1) {
      if (seen.has(r.newName)) r.conflict = true;
      else seen.add(r.newName);
    }
  }

  // 文件改名：进入每个子目录扫描所有文件
  const fileRenames = []; // 按子目录分组
  for (const r of folderRenames) {
    if (r.conflict) {
      fileRenames.push({ dirOld: r.oldName, dirNew: r.newName, files: [], conflict: true });
      continue;
    }
    const files = [];
    const usedNames = new Set();
    for await (const entry of r.handle.values()) {
      if (entry.kind !== 'file') continue;
      const oldName = entry.name;
      let newName = normalizeFileName(oldName);
      if (newName === oldName) {
        // 名称未变化，跳过
        continue;
      }
      // 子目录内去重
      if (usedNames.has(newName)) {
        // 找一个带 (n) 后缀的可用名
        const dot = newName.lastIndexOf('.');
        const stem = dot > 0 ? newName.slice(0, dot) : newName;
        const ext = dot > 0 ? newName.slice(dot + 1) : '';
        let n = 2;
        let candidate;
        do {
          candidate = ext ? `${stem} (${n}).${ext}` : `${stem} (${n})`;
          n++;
        } while (usedNames.has(candidate));
        newName = candidate;
      }
      usedNames.add(newName);
      files.push({ handle: entry, oldName, newName });
    }
    fileRenames.push({ dirOld: r.oldName, dirNew: r.newName, handle: r.handle, files, conflict: false });
  }

  return { folderRenames, fileRenames };
}

// ------- 渲染预览 -------
function renderPreview(plan) {
  const folderCount = plan.folderRenames.length;
  const conflictCount = plan.folderRenames.filter(r => r.conflict).length;
  const totalFiles = plan.fileRenames.reduce((s, g) => s + g.files.length, 0);
  previewSummary.textContent = `文件夹改名 ${folderCount} 个（其中冲突跳过 ${conflictCount} 个），文件改名 ${totalFiles} 个。`;

  let html = '';
  // 文件夹改名预览
  html += section('文件夹改名（' + folderCount + '）', plan.folderRenames.map(r =>
    `<div class="file-item${r.conflict ? ' skip' : ''}">
      <span class="file-name">${escapeHtml(r.oldName)}</span>
      <span class="file-from">→ ${escapeHtml(r.newName)}${r.conflict ? '（冲突，跳过）' : ''}</span>
    </div>`).join(''));

  // 文件改名预览（按子目录分组）
  for (const g of plan.fileRenames) {
    if (g.files.length === 0 && !g.conflict) continue;
    const groupTitle = g.conflict
      ? `${escapeHtml(g.dirOld)} → ${escapeHtml(g.dirNew)}（冲突跳过）`
      : `${escapeHtml(g.dirOld)} → ${escapeHtml(g.dirNew)}（${g.files.length} 个文件改名）`;
    const body = g.files.length === 0
      ? '<div class="file-empty">无文件改名</div>'
      : g.files.map(f =>
          `<div class="file-rename-row">
            <span class="from">${escapeHtml(f.oldName)}</span>
            <span class="arrow">→</span>
            <span class="to">${escapeHtml(f.newName)}</span>
          </div>`).join('');
    html += `<div class="file-rename-group"><h4>${groupTitle}</h4>${body}</div>`;
  }
  previewDetail.innerHTML = html;
}

function section(title, body, modifier) {
  return `<div class="preview-section${modifier ? ' ' + modifier : ''}">
    <h3>${title}</h3>
    <div class="file-list">${body || '<div class="file-empty">无</div>'}</div>
  </div>`;
}

// ------- 执行改名 -------
btnExec.addEventListener('click', async () => {
  if (!state.rootHandle || !state.plan) return;
  btnExec.disabled = true;
  btnReScan.disabled = true;
  reportPanel.hidden = false;
  reportContent.innerHTML = '<div class="status">执行中…</div>';

  try {
    const result = await executeRename(state.rootHandle, state.plan);
    renderReport(state.plan, result);
  } catch (e) {
    reportContent.innerHTML = `<div class="status err">执行失败：${escapeHtml(e.message)}</div>`;
  } finally {
    btnExec.disabled = false;
    btnReScan.disabled = false;
  }
});

async function executeRename(rootHandle, plan) {
  const folderResults = []; // { oldName, newName, ok, error }
  const fileResults = [];  // { dirOld, dirNew, items: [{ oldName, newName, ok, error }] }

  // 1. 改文件夹名 + 改文件夹内文件名
  for (const r of plan.folderRenames) {
    if (r.conflict) {
      folderResults.push({ oldName: r.oldName, newName: r.newName, ok: false, error: '冲突跳过' });
      continue;
    }
    // 改文件夹名
    let dirHandle = r.handle;
    let newName = r.newName;
    let oldName = r.oldName;
    let folderOk = true;
    let folderErr = '';
    try {
      if (newName !== oldName) {
        await renameEntry(rootHandle, oldName, newName, true);
        // 改名后获取新 handle
        dirHandle = await rootHandle.getDirectoryHandle(newName);
      }
    } catch (e) {
      folderOk = false;
      folderErr = e.message;
    }
    folderResults.push({ oldName, newName, ok: folderOk, error: folderErr });
    if (!folderOk) continue;

    // 改文件名（在新 handle 内）
    const group = plan.fileRenames.find(g => g.dirOld === r.oldName);
    const items = [];
    if (group && group.files.length > 0) {
      for (const f of group.files) {
        let ok = true, err = '';
        if (f.newName !== f.oldName) {
          try {
            await renameEntry(dirHandle, f.oldName, f.newName, false);
          } catch (e) {
            ok = false; err = e.message;
          }
        }
        items.push({ oldName: f.oldName, newName: f.newName, ok, error: err });
      }
    }
    fileResults.push({ dirOld: r.oldName, dirNew: r.newName, items });
  }

  return { folderResults, fileResults };
}

// ------- 重命名通用入口（move 优先，复制+删除回退） -------
async function renameEntry(parentHandle, oldName, newName, isDir) {
  // 方案 A：优先 move（如可用）
  if (parentHandle.move) {
    try {
      const h = isDir
        ? await parentHandle.getDirectoryHandle(oldName)
        : await parentHandle.getFileHandle(oldName);
      if (h.move) {
        await h.move(newName);
        return;
      }
    } catch (e) { /* 落到方案 B */ }
  }
  // 方案 B：复制 + 删除
  if (isDir) {
    const src = await parentHandle.getDirectoryHandle(oldName);
    const dst = await parentHandle.getDirectoryHandle(newName, { create: true });
    for await (const entry of src.values()) {
      await copyTree(src, dst, entry);
    }
    await parentHandle.removeEntry(oldName, { recursive: true });
  } else {
    const src = await parentHandle.getFileHandle(oldName);
    const dst = await parentHandle.getFileHandle(newName, { create: true });
    const w = await dst.createWritable();
    await w.write(await src.getFile());
    await w.close();
    await parentHandle.removeEntry(oldName);
  }
}

async function copyTree(srcHandle, dstHandle, entry) {
  if (entry.kind === 'file') {
    const srcFile = await entry.getFile();
    const dstFileHandle = await dstHandle.getFileHandle(entry.name, { create: true });
    const w = await dstFileHandle.createWritable();
    await w.write(srcFile);
    await w.close();
  } else if (entry.kind === 'directory') {
    const subSrc = await srcHandle.getDirectoryHandle(entry.name);
    const subDst = await dstHandle.getDirectoryHandle(entry.name, { create: true });
    for await (const subEntry of subSrc.values()) {
      await copyTree(subSrc, subDst, subEntry);
    }
  }
}

// ------- 渲染报告 -------
function renderReport(plan, result) {
  const okFolders = result.folderResults.filter(r => r.ok).length;
  const skipFolders = result.folderResults.length - okFolders;
  const totalFiles = result.fileResults.reduce((s, g) => s + g.items.length, 0);
  const okFiles = result.fileResults.reduce((s, g) => s + g.items.filter(i => i.ok).length, 0);
  const failFiles = totalFiles - okFiles;

  let html = `<div class="report-summary">文件夹改名完成 ${okFolders} 个，跳过/失败 ${skipFolders} 个；文件改名完成 ${okFiles} 个，失败 ${failFiles} 个。</div>`;

  if (okFolders > 0) {
    html += section('文件夹改名成功（' + okFolders + '）',
      result.folderResults.filter(r => r.ok).map(r =>
        `<div class="file-item ok"><span class="file-name">${escapeHtml(r.oldName)}</span><span class="file-from">→ ${escapeHtml(r.newName)}</span></div>`).join(''));
  }
  if (skipFolders > 0) {
    html += section('文件夹改名跳过/失败（' + skipFolders + '）',
      result.folderResults.filter(r => !r.ok).map(r =>
        `<div class="file-item skip"><span class="file-name">${escapeHtml(r.oldName)}</span><span class="file-from">→ ${escapeHtml(r.newName)}${r.error ? '（' + escapeHtml(r.error) + '）' : ''}</span></div>`).join(''), 'warn');
  }

  for (const g of result.fileResults) {
    if (g.items.length === 0) continue;
    const okCount = g.items.filter(i => i.ok).length;
    const title = `${escapeHtml(g.dirOld)} → ${escapeHtml(g.dirNew)}（成功 ${okCount}/${g.items.length}）`;
    const body = g.items.map(f =>
      `<div class="file-rename-row${f.ok ? '' : ' skip'}">
        <span class="from">${escapeHtml(f.oldName)}</span>
        <span class="arrow">→</span>
        <span class="to">${escapeHtml(f.newName)}${f.error ? '（' + escapeHtml(f.error) + '）' : ''}</span>
      </div>`).join('');
    html += `<div class="file-rename-group"><h4>${title}</h4>${body}</div>`;
  }

  reportContent.innerHTML = html;
}

  state.childDirs = [];
  state.configs = [];
  state.plan = null;
  cfgPanel.hidden = true;
  previewPanel.hidden = true;
  reportPanel.hidden = true;
  dirList.innerHTML = '';
  pickText.textContent = '点击选择根目录，或直接拖入文件夹';
  statusPick.className = 'status';
  statusPick.textContent = '';
  statusCfg.className = 'status';
  statusCfg.textContent = '';
});

// ------- 工具函数 -------
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
