<script>
// =============================================================
// 语种重组模块 — 独立页面
// 输入：按类别组织的源目录；输出：按语种组织的目录
// =============================================================

const LANG_FULL = { en:'英语', de:'德语', es:'西班牙语', 'es-BR':'西班牙语', ja:'日语', ko:'韩语', th:'泰语', fr:'法语', zh:'中文' };
const LANG_CHAR = { en:'英', de:'德', es:'西', 'es-BR':'西', ja:'日', ko:'韩', th:'泰', fr:'法', zh:'中' };
const BASE_LANG = 'en';

// 类别识别：关键字 → 类别标识
const CATEGORIES = [
  { key: '旁白', id: 'VO',   label: '旁白' },
  { key: '压制', id: 'DUB',  label: '压制' },
  { key: '原剧', id: 'ORIG', label: '原剧' },
  { key: '字幕', id: 'SUB',  label: '字幕' },
  { key: '净版', id: 'CLEAN',label: '净版' },
];

const state = {
  rootHandle: null,
  showName: '',
  source: null, // scanSource 返回的结构
};

const pickDrop       = document.getElementById('pickDrop');
const pickText       = document.getElementById('pickText');
const statusPick     = document.getElementById('statusPick');
const previewPanel   = document.getElementById('previewPanel');
const scanSummary    = document.getElementById('scanSummary');
const previewDetail  = document.getElementById('previewDetail');
const btnExec        = document.getElementById('btnExec');
const btnReScan      = document.getElementById('btnReScan');
const reportPanel    = document.getElementById('reportPanel');
const reportContent  = document.getElementById('reportContent');

if (!window.showDirectoryPicker) {
  pickText.textContent = '当前浏览器不支持语种重组';
  pickDrop.style.opacity = '0.5';
  pickDrop.style.cursor = 'not-allowed';
  statusPick.className = 'status err';
  statusPick.textContent = '请使用 Chrome/Edge 浏览器，需要 File System Access API 支持。';
}

// ------- 选择根目录 -------
async function useRootHandle(handle) {
  if (!handle || handle.kind !== 'directory') {
    statusPick.className = 'status err';
    statusPick.textContent = '请提供文件夹（而非单个文件）';
    return;
  }
  const perm = await handle.requestPermission?.({ mode: 'readwrite' });
  if (perm && perm !== 'granted') {
    statusPick.className = 'status err';
    statusPick.textContent = '未授权读写权限，无法重组';
    return;
  }
  state.rootHandle = handle;
  state.showName = handle.name;
  pickText.innerHTML = `已选择源目录：<b>${escapeHtml(handle.name)}</b>`;
  statusPick.className = 'status';
  statusPick.textContent = '扫描源目录结构中…';
  previewPanel.hidden = true;
  reportPanel.hidden = true;
  try {
    state.source = await scanSource(handle);
    renderPreview(state.source);
    previewPanel.hidden = false;
    statusPick.className = 'status ok';
    const langs = state.source.targetLangs;
    statusPick.textContent = `扫描完成：识别到 ${langs.length} 个目标语种，点击「执行重组」开始`;
  } catch (e) {
    state.rootHandle = null;
    statusPick.className = 'status err';
    statusPick.textContent = '扫描失败：' + e.message;
  }
}

pickDrop.addEventListener('click', async () => {
  if (!window.showDirectoryPicker) return;
  try {
    const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
    await useRootHandle(handle);
  } catch (e) {
    if (e.name === 'AbortError') {
      statusPick.className = 'status';
      statusPick.textContent = '已取消选择';
    } else {
      statusPick.className = 'status err';
      statusPick.textContent = '选择目录失败：' + e.message;
    }
  }
});

['dragenter', 'dragover'].forEach(evt => {
  pickDrop.addEventListener(evt, (e) => {
    e.preventDefault(); e.stopPropagation();
    pickDrop.classList.add('dz-hover');
  });
});
['dragleave', 'drop'].forEach(evt => {
  pickDrop.addEventListener(evt, (e) => {
    e.preventDefault(); e.stopPropagation();
    pickDrop.classList.remove('dz-hover');
  });
});
pickDrop.addEventListener('drop', async (e) => {
  if (!window.showDirectoryPicker) return;
  const items = e.dataTransfer?.items;
  if (!items) return;
  try {
    let dirHandle = null;
    for (const item of items) {
      const getHandle = item.getAsFileSystemHandle ? item.getAsFileSystemHandle() : null;
      if (!getHandle) continue;
      const h = await getHandle;
      if (h && h.kind === 'directory') { dirHandle = h; break; }
    }
    if (dirHandle) { await useRootHandle(dirHandle); return; }
    statusPick.className = 'status err';
    statusPick.textContent = '请拖入文件夹，而非单个文件';
  } catch (err) {
    statusPick.className = 'status err';
    statusPick.textContent = '拖入目录失败：' + (err.message || err.name);
  }
});

// ------- 扫描源结构 -------
async function scanSource(rootHandle) {
  const catMap = {}; // id -> { name, handle, langs: Set }
  const langSet = new Set();
  let xlsxFile = null; // { handle, name }

  for await (const entry of rootHandle.values()) {
    if (entry.kind === 'directory') {
      const cat = CATEGORIES.find(c => entry.name.includes(c.key));
      if (cat) {
        catMap[cat.id] = { name: entry.name, handle: entry, langs: new Set() };
      }
    }
  }

  // 对 VO/DUB/SUB 扫描语种子文件夹
  for (const catId of ['VO', 'DUB', 'SUB']) {
    const cat = catMap[catId];
    if (!cat) continue;
    for await (const entry of cat.handle.values()) {
      if (entry.kind === 'directory' && LANG_FULL[entry.name]) {
        cat.langs.add(entry.name);
        langSet.add(entry.name);
      }
    }
  }

  // 递归查找 xlsx（取第一个）
  async function findXlsx(dirHandle) {
    for await (const entry of dirHandle.values()) {
      if (entry.kind === 'file' && /\.xlsx$/i.test(entry.name)) {
        return { handle: entry, name: entry.name };
      }
      if (entry.kind === 'directory') {
        const found = await findXlsx(entry);
        if (found) return found;
      }
    }
    return null;
  }
  xlsxFile = await findXlsx(rootHandle);

  const allLangs = Array.from(langSet).sort();
  const targetLangs = allLangs.filter(l => l !== BASE_LANG);

  return { catMap, allLangs, targetLangs, xlsxFile };
}

// ------- 输出子文件夹名生成 -------
// 注：英X字幕/英X旁白需要同时合并 en（基准）和 X（目标语种）两个语种文件夹的内容
function outputSubFolders(langCode) {
  const c = LANG_CHAR[langCode];
  return [
    { id: 'ORIG', name: '原剧',           op: 'copy', srcLangs: ['*'] },
    { id: 'CLEAN',name: '净版视频',       op: 'copy', srcLangs: ['*'] },
    { id: 'SUB',  name: `英${c}字幕`,     op: 'copy', srcLangs: [BASE_LANG, langCode] },
    { id: 'VO',   name: `英${c}旁白`,     op: 'copy', srcLangs: [BASE_LANG, langCode] },
    { id: 'DUB',  name: `${c}语压制视频`, op: 'copy', srcLangs: [langCode] },
  ];
}

// ------- 渲染预览 -------
function renderPreview(src) {
  const catsFound = CATEGORIES.map(c => {
    const found = !!src.catMap[c.id];
    return `<span class="reorg-cat-chip ${found ? 'found' : 'missing'}">${c.label}${found ? ' ✓' : ' ✗'}</span>`;
  }).join('');

  const langChips = src.allLangs.map(l => {
    const isBase = l === BASE_LANG;
    return `<span class="reorg-cat-chip ${isBase ? '' : 'found'}">${LANG_FULL[l]} (${l})${isBase ? ' 基准' : ''}</span>`;
  }).join('');

  scanSummary.innerHTML = `
    <div><b>剧名：</b>${escapeHtml(state.showName)}</div>
    <div style="margin-top:0.3rem"><b>类别文件夹：</b>${catsFound}</div>
    <div style="margin-top:0.3rem"><b>识别语种：</b>${langChips}</div>
    <div style="margin-top:0.3rem"><b>xlsx：</b>${src.xlsxFile ? escapeHtml(src.xlsxFile.name) + '（将复制为「本地化清单.xlsx」）' : '<span style="color:#c0392b">未找到</span>'}</div>
    <div style="margin-top:0.3rem;color:#2e8b6e">ℹ 所有操作均为复制，源文件夹保持不变</div>
  `;

  let html = '<div class="reorg-tree">';
  for (const lang of src.targetLangs) {
    const fullName = LANG_FULL[lang];
    const outputName = `${fullName} ${state.showName}`;
    const subs = outputSubFolders(lang);
    let itemsHtml = '';
    for (const sub of subs) {
      const cat = src.catMap[sub.id];
      let available = false;
      let srcPath = '（源缺失）';
      if (cat) {
        if (sub.srcLangs[0] === '*') {
          // ORIG/CLEAN：整个类别文件夹
          available = true;
          srcPath = cat.name;
        } else {
          // SUB/VO/DUB：检查每个需要的语种子文件夹
          const paths = [];
          let allFound = true;
          for (const sl of sub.srcLangs) {
            if (cat.langs.has(sl)) {
              paths.push(`${cat.name}/${sl}`);
            } else {
              paths.push(`${cat.name}/${sl}（缺失）`);
              allFound = false;
            }
          }
          srcPath = paths.join(' + ');
          available = allFound;
        }
      }
      itemsHtml += `<div class="reorg-item">
        <span class="op-copy">复制</span>
        <span class="target">${escapeHtml(sub.name)}</span>
        <span class="src">${escapeHtml(srcPath)}</span>
        <span>${available ? '' : '<span style="color:#c0392b">跳过</span>'}</span>
      </div>`;
    }
    // xlsx 行
    const xlsxAvail = !!src.xlsxFile;
    itemsHtml += `<div class="reorg-item">
      <span class="op-copy">复制</span>
      <span class="target">本地化清单.xlsx</span>
      <span class="src">${xlsxAvail ? escapeHtml(src.xlsxFile.name) : '（未找到 xlsx）'}</span>
      <span>${xlsxAvail ? '' : '<span style="color:#c0392b">跳过</span>'}</span>
    </div>`;

    html += `<div class="reorg-lang-group">
      <div class="reorg-lang-head">
        <span><span class="reorg-output-name">${escapeHtml(outputName)}</span></span>
        <span class="lang-code">${lang}</span>
      </div>
      ${itemsHtml}
    </div>`;
  }
  if (src.targetLangs.length === 0) {
    html += '<div class="status err">未找到除英语外的其他语种，无法产出输出</div>';
  }
  html += '</div>';
  previewDetail.innerHTML = html;
}

// ------- 执行重组 -------
const progressBox   = document.getElementById('progressBox');
const progressStage = document.getElementById('progressStage');
const progressCount = document.getElementById('progressCount');
const progressFill  = document.getElementById('progressFill');
const progressFile  = document.getElementById('progressFile');

btnExec.addEventListener('click', async () => {
  if (!state.rootHandle || !state.source) return;
  btnExec.disabled = true;
  btnReScan.disabled = true;
  reportPanel.hidden = false;
  progressBox.hidden = false;
  progressStage.textContent = '准备中…';
  progressCount.textContent = '0 / 0';
  progressFill.style.width = '0%';
  progressFile.textContent = '';
  reportContent.innerHTML = '<div class="status">执行中…</div>';

  try {
    const result = await executeReorganize(
      state.rootHandle, state.source, state.showName,
      ({ stage, path, copied, total }) => {
        progressStage.textContent = stage || '复制中…';
        progressCount.textContent = `${copied} / ${total}`;
        progressFile.textContent = path || '';
        const pct = total > 0 ? Math.min(100, (copied / total) * 100) : 0;
        progressFill.style.width = pct.toFixed(1) + '%';
      }
    );
    progressBox.hidden = true;
    renderReport(result);
  } catch (e) {
    reportContent.innerHTML = `<div class="status err">执行失败：${escapeHtml(e.message)}</div>`;
  } finally {
    btnExec.disabled = false;
    btnReScan.disabled = false;
  }
});

async function executeReorganize(rootHandle, src, showName, onProgress) {
  const results = []; // 每个语种一个结果

  for (const lang of src.targetLangs) {
    const fullName = LANG_FULL[lang];
    const outputName = `${fullName} ${showName}`;
    const langResult = { outputName, lang, items: [], errors: [] };

    // 检查输出父文件夹是否已存在
    let outputHandle = null;
    let outputOk = true;
    try {
      outputHandle = await rootHandle.getDirectoryHandle(outputName, { create: true });
    } catch (e) {
      outputOk = false;
      langResult.items.push({ target: outputName, op: '创建父文件夹', ok: false, error: e.message });
    }
    if (!outputOk) { results.push(langResult); continue; }

    const subs = outputSubFolders(lang);
    // 预扫描本语种需要复制的文件总数
    let totalFiles = 0;
    for (const sub of subs) {
      const cat = src.catMap[sub.id];
      if (!cat) continue;
      try {
        if (sub.srcLangs[0] === '*') {
          totalFiles += await countFiles(cat.handle);
        } else {
          for (const sl of sub.srcLangs) {
            try {
              const subHandle = await cat.handle.getDirectoryHandle(sl);
              totalFiles += await countFiles(subHandle);
            } catch (e) {}
          }
        }
      } catch (e) {}
    }
    if (src.xlsxFile) totalFiles += 1;

    let copied = 0;
    const progressCb = (path, ok, err) => {
      copied++;
      onProgress && onProgress({
        stage: `${outputName} / 复制中`,
        path, copied, total: totalFiles,
      });
    };

    for (const sub of subs) {
      const cat = src.catMap[sub.id];
      if (!cat) {
        langResult.items.push({ target: sub.name, op: sub.op, ok: false, error: '源类别文件夹缺失' });
        continue;
      }
      try {
        if (sub.srcLangs[0] === '*') {
          // ORIG/CLEAN：复制整个类别文件夹内容
          const dst = await outputHandle.getDirectoryHandle(sub.name, { create: true });
          await copyDirContents(cat.handle, dst, progressCb, cat.name, langResult.errors);
          langResult.items.push({ target: sub.name, op: '复制', ok: true });
        } else {
          // SUB/VO：合并 en（基准）+ X（目标语种）；
          // DUB：仅 X
          const dst = await outputHandle.getDirectoryHandle(sub.name, { create: true });
          const missingLangs = [];
          for (const sl of sub.srcLangs) {
            let srcSubHandle = null;
            try {
              srcSubHandle = await cat.handle.getDirectoryHandle(sl);
            } catch (e) {
              missingLangs.push(sl);
              continue;
            }
            await copyDirContents(srcSubHandle, dst, progressCb, `${cat.name}/${sl}`, langResult.errors);
          }
          if (missingLangs.length > 0) {
            langResult.items.push({
              target: sub.name,
              op: '复制',
              ok: false,
              error: `部分源缺失：${cat.name}/${missingLangs.join(',')} 不存在`,
            });
          } else {
            langResult.items.push({ target: sub.name, op: '复制', ok: true });
          }
        }
      } catch (e) {
        langResult.items.push({ target: sub.name, op: '复制', ok: false, error: e.message });
      }
    }

    // xlsx 复制（流式）
    if (src.xlsxFile) {
      try {
        const dstFile = await outputHandle.getFileHandle('本地化清单.xlsx', { create: true });
        const w = await dstFile.createWritable();
        const srcFile = await src.xlsxFile.handle.getFile();
        if (srcFile.stream && typeof srcFile.stream === 'function') {
          await w.write(srcFile.stream());
        } else {
          await w.write(srcFile);
        }
        await w.close();
        copied++;
        onProgress && onProgress({ stage: `${outputName} / xlsx`, path: '本地化清单.xlsx', copied, total: totalFiles });
        langResult.items.push({ target: '本地化清单.xlsx', op: '复制', ok: true });
      } catch (e) {
        langResult.items.push({ target: '本地化清单.xlsx', op: '复制', ok: false, error: e.message });
      }
    } else {
      langResult.items.push({ target: '本地化清单.xlsx', op: '复制', ok: false, error: '源目录未找到 xlsx' });
    }

    results.push(langResult);
  }
  return results;
}

// ------- 复制目录内容（流式 + 进度 + 错误恢复） -------
// progress(path, ok) 每个文件回调；errors 累计失败列表
async function copyDirContents(srcHandle, dstHandle, progress, pathPrefix, errors) {
  for await (const entry of srcHandle.values()) {
    if (entry.kind === 'file') {
      const curPath = pathPrefix ? `${pathPrefix}/${entry.name}` : entry.name;
      try {
        const srcFile = await entry.getFile();
        const dstFile = await dstHandle.getFileHandle(entry.name, { create: true });
        const w = await dstFile.createWritable();
        // 优先用 stream 流式写入（避免大文件读入内存）；不支持则回退到 Blob
        if (srcFile.stream && typeof srcFile.stream === 'function') {
          await w.write(srcFile.stream());
        } else {
          await w.write(srcFile);
        }
        await w.close();
        progress && progress(curPath, true);
      } catch (e) {
        errors && errors.push({ path: curPath, error: e.message });
        progress && progress(curPath, false, e.message);
      }
    } else if (entry.kind === 'directory') {
      const subDst = await dstHandle.getDirectoryHandle(entry.name, { create: true });
      const subSrc = await srcHandle.getDirectoryHandle(entry.name);
      const subPrefix = pathPrefix ? `${pathPrefix}/${entry.name}` : entry.name;
      await copyDirContents(subSrc, subDst, progress, subPrefix, errors);
    }
  }
}

// ------- 预扫描统计文件总数 -------
async function countFiles(dirHandle) {
  let n = 0;
  for await (const entry of dirHandle.values()) {
    if (entry.kind === 'file') n++;
    else if (entry.kind === 'directory') {
      const sub = await dirHandle.getDirectoryHandle(entry.name);
      n += await countFiles(sub);
    }
  }
  return n;
}

// （所有操作均为复制，无需移动/删除函数）

// ------- 渲染报告 -------
function renderReport(results) {
  let html = '';
  for (const r of results) {
    const okCount = r.items.filter(i => i.ok).length;
    const total = r.items.length;
    const errCount = (r.errors && r.errors.length) || 0;
    html += `<div class="reorg-report-group">
      <h4 style="margin:0 0 0.3rem">${escapeHtml(r.outputName)}（${okCount}/${total} 成功${errCount ? '，' + errCount + ' 个文件失败' : ''}）</h4>`;
    for (const item of r.items) {
      const cls = item.ok ? 'ok' : (item.error ? 'fail' : 'skip');
      const icon = item.ok ? '✓' : '✗';
      html += `<div class="reorg-report-item ${cls}">${icon} [${item.op}] ${escapeHtml(item.target)}${item.error ? ' — ' + escapeHtml(item.error) : ''}</div>`;
    }
    if (errCount > 0) {
      html += '<div style="margin-top:0.3rem;padding-left:0.8rem;border-left:2px solid #e0b4b4;font-size:0.74rem;color:#b85e5e">';
      for (const e of r.errors.slice(0, 50)) {
        html += `<div>✗ ${escapeHtml(e.path)} — ${escapeHtml(e.error)}</div>`;
      }
      if (r.errors.length > 50) {
        html += `<div>… 还有 ${r.errors.length - 50} 个失败项</div>`;
      }
      html += '</div>';
    }
    html += '</div>';
  }
  reportContent.innerHTML = html;
}

// ------- 重新选择 -------
btnReScan.addEventListener('click', () => {
  state.rootHandle = null;
  state.showName = '';
  state.source = null;
  previewPanel.hidden = true;
  reportPanel.hidden = true;
  pickText.textContent = '点击选择源根目录，或直接拖入文件夹';
  statusPick.className = 'status';
  statusPick.textContent = '';
});

// ------- 工具 -------
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
