<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>术语替换 · 字幕工具箱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>
  <header class="hud-top">
    <a href="index.html" class="brand"><span class="brand-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="4" width="12" height="1.5" rx=".5" fill="#fafffd"/><rect x="2" y="7.25" width="9" height="1.5" rx=".5" fill="#fafffd" opacity=".9"/><rect x="2" y="10.5" width="11" height="1.5" rx=".5" fill="#fafffd" opacity=".75"/></svg>
      </span>字幕工具箱</a>
    <nav class="hud-nav">
      <a href="index.html">首页</a>
      <a href="replace.html" class="active">术语替换</a>
      <a href="identify.html">术语识别</a>
      <a href="fix.html">SRT 修复</a>
    </nav>
  </header>
  <main class="hud-main">
    <h1 class="page-title">术语替换</h1>
    <p class="page-sub">本地化清单 Source 列将会替换为 Target 列</p>

    <section class="panel">
      <div class="panel-head"><span class="panel-dot"></span><h2>1. 上传与扫描</h2></div>
      <p class="card-desc">
        Source 列支持 <code>词A/词B</code> 或 <code>词A\词B</code> 拆成多条。ZIP 内任意子文件夹的 SRT 均可识别。
      </p>
      <div class="field">
        <label>本地化清单 (.xlsx)</label>
        <input type="file" id="glossary" accept=".xlsx,.xls" />
      </div>
      <div class="field">
        <label>字幕（ZIP 压缩包 或 直接拖入文件夹）</label>
        <div class="drop-zone" id="dropZoneReplace">
          <input type="file" id="subsReplaceZip" accept=".zip" />
          <input type="file" id="subsReplaceFolder" webkitdirectory multiple hidden />
          <div class="drop-hint">
            <span class="drop-icon">📁</span>
            <span>点击选择 ZIP / 文件夹，或直接拖入文件夹</span>
          </div>
        </div>
      </div>
      <div class="actions">
        <button type="button" id="btnScan" class="btn-secondary">扫描替换位置</button>
      </div>
      <div class="status" id="statusScan"></div>
      <p class="compare-summary" id="scanSummary"></p>

      <div class="scan-layout" id="scanLayout" hidden>
        <div class="term-list" id="termList"></div>
        <div>
          <div class="scan-toolbar">
            <label><input type="checkbox" id="chkTermAll" checked /> 本词全选</label>
            <label><input type="checkbox" id="chkGlobalAll" checked /> 全部全选</label>
            <span id="targetSelectorWrap" class="target-selector-wrap" hidden>
              <label>替换为：
                <select id="targetSelect" class="target-select"></select>
              </label>
            </span>
          </div>
          <div class="diff-table-wrap">
            <table class="diff-table">
              <thead>
                <tr>
                  <th>选</th>
                  <th>文件</th>
                  <th>句序</th>
                  <th>时间</th>
                  <th>原文句</th>
                </tr>
              </thead>
              <tbody id="hitBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><span class="panel-dot"></span><h2>2. 执行替换</h2></div>
      <div class="opts">
        <label><input type="checkbox" id="preview" /> 预览（仅第一集）</label>
        <label><input type="checkbox" id="alsoFix" checked /> 替换后 SRT 规范化</label>
        <label><input type="checkbox" id="exportFolder" /> 导出为文件夹（需 Chrome/Edge）</label>
        <label id="folderNameWrap" hidden>文件夹名称：
          <input type="text" id="folderName" class="folder-name-input" placeholder="replaced" />
        </label>
        <label>输出后缀：
          <select id="langSuffix" class="scene-select">
            <option value="">不添加</option>
            <option value=".zh_cn">.zh_cn（简体中文）</option>
            <option value=".en">.en（英语）</option>
            <option value=".ja">.ja（日语）</option>
            <option value=".es">.es（西班牙语）</option>
            <option value=".ko">.ko（韩语）</option>
            <option value=".de">.de（德语）</option>
            <option value=".fr">.fr（法语）</option>
            <option value=".th">.th（泰语）</option>
          </select>
        </label>
      </div>
      <div class="actions">
        <button type="button" id="btnReplace">按勾选开始替换</button>
      </div>
      <div class="status" id="statusReplace"></div>
    </section>
  </main>
  <script src="srt.js?v=3"></script>
  <script>
    let scanData = null;
    let selectedIds = new Set();
    let activeSource = null;
    let glossaryEntries = [];
    let subtitleFiles = [];
    let sourceType = null; // 'zip' | 'folder' | 'drop'
    let droppedSrtFiles = []; // files from drag-drop
    let multiTargetMap = {}; // source -> [target1, target2, ...]
    let selectedTargets = {}; // source -> user-selected target

    const SOURCE_ALIASES = ['source', '中文', '原文', '源文', '词条', '术语', 'chinese', 'zh', '中文词条', '中文原文', '源'];
    const TARGET_ALIASES = ['target', '译文', '英文', '目标语', '翻译', 'english', 'en', '外语', '外文', '英文译名', '译名', '替换', '替换为', '替换内容', '目标文本', '目标'];

    const subsReplaceZip = document.getElementById('subsReplaceZip');
    const subsReplaceFolder = document.getElementById('subsReplaceFolder');
    const dropZoneReplace = document.getElementById('dropZoneReplace');
    const exportFolder = document.getElementById('exportFolder');
    const folderNameWrap = document.getElementById('folderNameWrap');

    exportFolder.addEventListener('change', () => {
      folderNameWrap.hidden = !exportFolder.checked;
    });

    dropZoneReplace.addEventListener('click', (e) => {
      const rect = dropZoneReplace.getBoundingClientRect();
      const y = e.clientY - rect.top;
      if (y < rect.height / 2) {
        subsReplaceZip.click();
      } else {
        subsReplaceFolder.click();
      }
    });

    subsReplaceZip.addEventListener('change', (e) => {
      if (e.target.files.length > 0) sourceType = 'zip';
    });
    subsReplaceFolder.addEventListener('change', (e) => {
      if (e.target.files.length > 0) sourceType = 'folder';
    });

    ['dragover', 'dragenter'].forEach(evt => {
      dropZoneReplace.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZoneReplace.classList.add('drag-over');
      });
    });
    ['dragleave', 'drop'].forEach(evt => {
      dropZoneReplace.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZoneReplace.classList.remove('drag-over');
      });
    });
    dropZoneReplace.addEventListener('drop', async (e) => {
      sourceType = 'drop';
      try {
        droppedSrtFiles = await extractSrtFromDropEvent(e);
        if (droppedSrtFiles.length === 0) {
          alert('拖入的内容中未找到 SRT 文件');
          sourceType = null;
          droppedSrtFiles = [];
        } else {
          statusScan.className = 'status ok';
          statusScan.textContent = `已识别 ${droppedSrtFiles.length} 个 SRT 文件，请点击"扫描替换位置"`;
        }
      } catch (err) {
        alert('读取拖入内容失败：' + err.message);
        sourceType = null;
        droppedSrtFiles = [];
      }
    });

    function normalizeHeader(name) {
      return String(name).trim().toLowerCase().replace(/\s+/g, '');
    }

    function findColumn(sheet, aliases) {
      const headerRow = sheet[0] || [];
      for (let i = 0; i < headerRow.length; i++) {
        const normalized = normalizeHeader(headerRow[i]);
        if (aliases.includes(normalized)) {
          return i;
        }
      }
      return -1;
    }

    async function loadGlossary(file) {
      const arrayBuffer = await file.arrayBuffer();
      const data = new Uint8Array(arrayBuffer);
      const workbook = XLSX.read(data, { type: 'array' });

      let targetSheet = null;
      for (const sheetName of workbook.SheetNames) {
        const sheet = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1 });
        const sourceCol = findColumn(sheet, SOURCE_ALIASES);
        const targetCol = findColumn(sheet, TARGET_ALIASES);
        if (sourceCol >= 0 && targetCol >= 0) {
          targetSheet = { name: sheetName, data: sheet, sourceCol, targetCol };
          break;
        }
      }

      if (!targetSheet) {
        throw new Error('未找到 Source 和 Target 列，请检查术语表格式');
      }

      const entries = [];
      const sourceTargetMap = {}; // source -> Set of targets
      const { data: sheet, sourceCol, targetCol } = targetSheet;

      for (let rowIdx = 1; rowIdx < sheet.length; rowIdx++) {
        const row = sheet[rowIdx];
        if (!row || !row[sourceCol]) continue;

        const source = String(row[sourceCol]).trim();
        const target = String(row[targetCol] || '').trim();

        if (!source) continue;
        if (!target) continue;

        const parts = source.split(/[/\\]+/).map(p => p.trim()).filter(p => p);

        for (const part of parts) {
          entries.push({
            source: part,
            target: target,
            priority: 0,
            matchType: 'phrase',
            blockIfLonger: true
          });
          if (!sourceTargetMap[part]) sourceTargetMap[part] = new Set();
          sourceTargetMap[part].add(target);
        }
      }

      // 检测同一 Source 有多个不同 Target 的情况
      const multiTargetMap = {};
      for (const [src, targets] of Object.entries(sourceTargetMap)) {
        if (targets.size > 1) {
          multiTargetMap[src] = [...targets];
        }
      }

      // 去重：同一 Source 只保留第一条词条（Target 由用户选择覆盖）
      const seenSources = new Set();
      const dedupedEntries = [];
      for (const entry of entries) {
        if (!seenSources.has(entry.source)) {
          seenSources.add(entry.source);
          dedupedEntries.push(entry);
        }
      }

      return { entries: dedupedEntries, sheetName: targetSheet.name, multiTargetMap };
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function allHitIds() {
      const ids = [];
      (scanData?.terms || []).forEach((t) => t.hits.forEach((h) => ids.push(h.id)));
      return ids;
    }

    function renderTermList() {
      termList.innerHTML = '';
      (scanData?.terms || []).forEach((t) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'term-item' + (t.source === activeSource ? ' active' : '');
        const multiBadge = multiTargetMap[t.source]
          ? ` <span class="multi-badge" title="该词有 ${multiTargetMap[t.source].length} 个可选 Target">多</span>`
          : '';
        b.innerHTML = esc(t.source) + multiBadge + ` <span class="cnt">${t.hits.length}</span>`;
        b.onclick = () => { activeSource = t.source; renderTermList(); renderHits(); updateTargetSelector(); };
        termList.appendChild(b);
      });
    }

    function updateTargetSelector() {
      const wrap = document.getElementById('targetSelectorWrap');
      const select = document.getElementById('targetSelect');
      const targets = multiTargetMap[activeSource];

      if (targets && targets.length > 1) {
        wrap.hidden = false;
        select.innerHTML = '';
        const currentTarget = selectedTargets[activeSource] || targets[0];
        targets.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t;
          opt.textContent = t;
          if (t === currentTarget) opt.selected = true;
          select.appendChild(opt);
        });
      } else {
        wrap.hidden = true;
      }
    }

    document.getElementById('targetSelect').addEventListener('change', (e) => {
      if (activeSource) {
        selectedTargets[activeSource] = e.target.value;
        renderHits();
      }
    });

    function renderHits() {
      const term = (scanData?.terms || []).find((t) => t.source === activeSource);
      hitBody.innerHTML = '';
      if (!term) return;
      const effectiveTarget = selectedTargets[term.source] || term.target;
      let allOn = true;
      term.hits.forEach((h) => {
        if (!selectedIds.has(h.id)) allOn = false;
        const tr = document.createElement('tr');
        const ck = document.createElement('input');
        ck.type = 'checkbox';
        ck.checked = selectedIds.has(h.id);
        ck.onchange = () => {
          if (ck.checked) {
            selectedIds.add(h.id);
          } else {
            selectedIds.delete(h.id);
          }
          chkTermAll.checked = term.hits.every((x) => selectedIds.has(x.id));
          chkGlobalAll.checked = allHitIds().every((id) => selectedIds.has(id));
        };
        const highlighted = highlightHit(h.line_text, h.start, h.end, h.source, effectiveTarget);
        tr.innerHTML =
          `<td></td><td>${esc(h.file)}</td><td>${h.line_no}</td><td>${esc(h.timecode)}</td><td>${highlighted}</td>`;
        tr.cells[0].appendChild(ck);
        hitBody.appendChild(tr);
      });
      chkTermAll.checked = allOn;
    }

    function highlightHit(text, start, end, source, target) {
      const before = esc(text.substring(0, start));
      const highlighted = `<span class="hit-source">${esc(source)}</span><span class="hit-arrow">→</span><span class="hit-target">${esc(target)}</span>`;
      const after = esc(text.substring(end));
      return before + highlighted + after;
    }

    async function loadSubtitleFiles() {
      subtitleFiles = [];
      
      if (sourceType === 'zip') {
        const z = subsReplaceZip.files[0];
        if (!z) throw new Error('请选择 ZIP 文件');
        const arrayBuffer = await z.arrayBuffer();
        const zip = await JSZip.loadAsync(arrayBuffer);
        for (const [name, file] of Object.entries(zip.files)) {
          if (file.dir || !name.toLowerCase().endsWith('.srt')) continue;
          const content = await file.async('string');
          subtitleFiles.push({ name, content });
        }
      } else if (sourceType === 'folder') {
        const items = extractSrtFromFileList(subsReplaceFolder.files);
        for (const item of items) {
          const content = await item.file.text();
          subtitleFiles.push({ name: item.name, content });
        }
      } else if (sourceType === 'drop') {
        for (const item of droppedSrtFiles) {
          const content = await item.file.text();
          subtitleFiles.push({ name: item.name, content });
        }
      } else {
        throw new Error('请选择或拖入字幕文件');
      }
      
      if (subtitleFiles.length === 0) {
        throw new Error('未找到 SRT 文件');
      }
    }

    btnScan.onclick = async () => {
      const g = glossary.files[0];
      if (!g) return alert('请上传本地化清单');
      if (!sourceType) return alert('请上传或拖入字幕（ZIP / 文件夹）');
      
      statusScan.className = 'status';
      statusScan.textContent = '扫描中…';
      btnScan.disabled = true;
      
      try {
        const glossResult = await loadGlossary(g);
        glossaryEntries = glossResult.entries;
        multiTargetMap = glossResult.multiTargetMap || {};
        selectedTargets = {};

        await loadSubtitleFiles();
        
        const terms = {};
        let totalHits = 0;
        
        const limit = preview.checked ? 1 : subtitleFiles.length;
        
        for (let i = 0; i < limit; i++) {
          const subFile = subtitleFiles[i];
          const subs = parseSrt(subFile.content);
          const outName = subFile.name.split('/').pop();
          
          for (let j = 0; j < subs.length; j++) {
            const line = subs[j];
            if (!line.text || !line.text.trim()) continue;
            
            const text = line.text.replace(/\n/g, ' ');
            const { hits } = scanTextHits(text, glossaryEntries);
            
            const tc = formatTimecode(line.start);
            
            for (const h of hits) {
              const src = h.source;
              const bucket = terms[src] || { source: src, target: h.target, hits: [] };
              
              bucket.hits.push({
                id: `${outName}|${j + 1}|${h.start}|${h.end}|${src}`,
                file: outName,
                line_no: j + 1,
                timecode: tc,
                line_text: text,
                source: h.source,
                target: h.target,
                start: h.start,
                end: h.end
              });
              
              totalHits++;
              terms[src] = bucket;
            }
          }
        }
        
        const termList = Object.values(terms).sort((a, b) => {
          if (b.hits.length !== a.hits.length) return b.hits.length - a.hits.length;
          return b.source.length - a.source.length;
        });
        
        scanData = {
          sheet_name: glossResult.sheetName,
          term_count: termList.length,
          hit_count: totalHits,
          terms: termList
        };
        
        selectedIds = new Set(allHitIds());
        activeSource = scanData.terms[0]?.source || null;

        const multiCount = Object.keys(multiTargetMap).length;
        const multiHint = multiCount > 0
          ? ` | <span style="color:#c7870f">⚠ ${multiCount} 个词有多个可选 Target，请点击词后在工具栏选择</span>`
          : '';
        scanSummary.innerHTML = `工作表: ${scanData.sheet_name} | ${scanData.term_count} 个词，${scanData.hit_count} 处命中${multiHint}`;
        scanLayout.hidden = !scanData.term_count;
        renderTermList();
        renderHits();
        updateTargetSelector();
        chkGlobalAll.checked = true;
        
        statusScan.className = 'status ok';
        statusScan.textContent = '扫描完成，请勾选后执行替换';
      } catch (e) {
        statusScan.className = 'status err';
        statusScan.textContent = e.message;
      } finally {
        btnScan.disabled = false;
      }
    };

    chkTermAll.onchange = () => {
      const term = (scanData?.terms || []).find((t) => t.source === activeSource);
      if (!term) return;
      term.hits.forEach((h) => {
        if (chkTermAll.checked) selectedIds.add(h.id); else selectedIds.delete(h.id);
      });
      renderHits();
      chkGlobalAll.checked = allHitIds().every((id) => selectedIds.has(id));
    };

    chkGlobalAll.onchange = () => {
      if (chkGlobalAll.checked) {
        allHitIds().forEach((id) => selectedIds.add(id));
      } else {
        selectedIds.clear();
      }
      renderHits();
    };

    btnReplace.onclick = async () => {
      const g = glossary.files[0];
      if (!g) return alert('请上传本地化清单');
      if (!sourceType || subtitleFiles.length === 0) return alert('请先扫描字幕');
      if (scanData && selectedIds.size === 0) return alert('请至少勾选一处替换');
      
      statusReplace.className = 'status';
      statusReplace.textContent = '替换中…';
      btnReplace.disabled = true;
      
      try {
        const outZip = new JSZip();
        const outputFiles = []; // for folder export
        const useFolderExport = exportFolder.checked;

        // 构建带用户选择 Target 的有效词条
        const effectiveEntries = glossaryEntries.map(e => {
          const sel = selectedTargets[e.source];
          return sel ? { ...e, target: sel } : e;
        });

        const limit = preview.checked ? 1 : subtitleFiles.length;

        const suffix = document.getElementById('langSuffix').value;
        const rawFolderName = document.getElementById('folderName').value.trim();
        const folderName = (rawFolderName || 'replaced').replace(/[\\/:*?"<>|]/g, '_');

        for (let i = 0; i < limit; i++) {
          const subFile = subtitleFiles[i];
          const subs = parseSrt(subFile.content);
          const originalName = subFile.name.split('/').pop();
          const outName = suffix
            ? originalName.replace(/\.srt$/i, suffix + '.srt')
            : originalName;

          for (let j = 0; j < subs.length; j++) {
            const line = subs[j];
            if (!line.text) continue;

            const original = line.text;
            const text = original.replace(/\n/g, ' ');
            const { text: replaced } = replaceText(text, effectiveEntries, {
              allowedHitIds: selectedIds,
              fileName: originalName,
              lineIndex: j + 1
            });

            line.text = replaced;
          }
          
          if (alsoFix.checked) {
            for (const line of subs) {
              if (line.text) {
                line.text = line.text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                const parts = line.text.split('\n').map(p => p.trim()).filter(p => p);
                line.text = parts.join('\n');
              }
              if (line.end <= line.start) {
                line.end = line.start + 2000;
              }
            }
          }
          
          const outContent = generateSrt(subs);
          const relPath = folderName + '/' + outName;
          outZip.file(relPath, outContent);
          outputFiles.push({ path: relPath, content: outContent });
        }

        if (useFolderExport) {
          if (!window.showDirectoryPicker) {
            throw new Error('当前浏览器不支持文件夹导出，请使用 Chrome/Edge，或取消勾选"导出为文件夹"');
          }
          const result = await saveFilesToFolder(outputFiles);
          if (!result.success) throw new Error(result.message);
          statusReplace.className = 'status ok';
          statusReplace.textContent = `${result.message}（位于 ${folderName}/ 文件夹内）`;
        } else {
          const blob = await outZip.generateAsync({ type: 'blob' });
          const zipName = suffix ? `replace_result${suffix}.zip` : 'replace_result.zip';
          downloadBlob(blob, zipName);
          statusReplace.className = 'status ok';
          statusReplace.textContent = '已完成，下载已开始';
        }
      } catch (e) {
        statusReplace.className = 'status err';
        statusReplace.textContent = e.message;
      } finally {
        btnReplace.disabled = false;
      }
    };

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
