<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>术语替换 · 字幕工具箱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css?v=7" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>
  <header class="hud-top">
    <a href="index.html" class="brand"><span class="brand-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="4" width="12" height="1.5" rx=".5" fill="#fafffd"/><rect x="2" y="7.25" width="9" height="1.5" rx=".5" fill="#fafffd" opacity=".9"/><rect x="2" y="10.5" width="11" height="1.5" rx=".5" fill="#fafffd" opacity=".75"/></svg>
      </span>字幕工具箱</a>
    <nav class="hud-nav">
      <a href="index.html">首页</a>
      <a href="replace.html" class="active">术语替换</a>
      <a href="identify.html">术语识别</a>
      <a href="fix.html">SRT 修复</a>
    </nav>
  </header>
  <main class="hud-main">
    <h1 class="page-title">术语替换</h1>
    <p class="page-sub">本地化清单 Source 列将会替换为 Target 列</p>

    <section class="panel">
      <div class="panel-head"><span class="panel-dot"></span><h2>1. 上传与扫描</h2></div>
      <p class="card-desc">
        Source 列支持 <code>词A/词B</code> 或 <code>词A\词B</code> 拆成多条。ZIP 内任意子文件夹的 SRT 均可识别。
      </p>
      <div class="field">
        <label>本地化清单 (.xlsx，可多选以启用多语言模式)</label>
        <input type="file" id="glossary" accept=".xlsx,.xls" multiple />
        <ul id="glossaryList" class="glossary-list"></ul>
      </div>
      <div class="field">
        <label>字幕（ZIP 压缩包 或 直接拖入文件夹）</label>
        <div class="drop-zone" id="dropZoneReplace">
          <input type="file" id="subsReplaceZip" accept=".zip" />
          <input type="file" id="subsReplaceFolder" webkitdirectory multiple hidden />
          <div class="drop-hint">
            <span class="drop-icon">📁</span>
            <span>点击选择 ZIP / 文件夹，或直接拖入文件夹</span>
          </div>
        </div>
      </div>
      <div class="actions">
        <button type="button" id="btnScan" class="btn-secondary">扫描替换位置</button>
      </div>
      <div class="status" id="statusScan"></div>
      <p class="compare-summary" id="scanSummary"></p>

      <div class="scan-layout" id="scanLayout" hidden>
        <div class="term-list" id="termList"></div>
        <div>
          <div class="scan-toolbar">
            <label><input type="checkbox" id="chkTermAll" checked /> 本词全选</label>
            <label><input type="checkbox" id="chkGlobalAll" checked /> 全部全选</label>
            <span id="targetSelectorWrap" class="target-selector-wrap" hidden>
              <label>批量替换为：
                <select id="targetSelect" class="target-select"></select>
              </label>
              <button type="button" id="btnApplyTargetAll" class="btn-apply-target">应用到本词全部</button>
            </span>
          </div>
          <div class="diff-table-wrap">
            <table class="diff-table">
              <thead>
                <tr id="hitHeadRow">
                  <th>选</th>
                  <th>文件</th>
                  <th>句序</th>
                  <th>时间</th>
                  <th>替换为</th>
                  <th>原文句（点击查看上下文）</th>
                </tr>
              </thead>
              <tbody id="hitBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><span class="panel-dot"></span><h2>2. 执行替换</h2></div>
      <div class="opts">
        <label><input type="checkbox" id="preview" /> 预览（仅第一集）</label>
        <label><input type="checkbox" id="alsoFix" checked /> 替换后 SRT 规范化</label>
        <label><input type="checkbox" id="exportFolder" /> 导出为文件夹（需 Chrome/Edge）</label>
        <label id="folderNameWrap" hidden>统一父文件夹名：
          <input type="text" id="folderName" class="folder-name-input" placeholder="replaced" />
        </label>
        <label>输出后缀：
          <select id="langSuffix" class="scene-select">
            <option value="">不添加</option>
            <option value=".zh_cn">.zh_cn（简体中文）</option>
            <option value=".en">.en（英语）</option>
            <option value=".ja">.ja（日语）</option>
            <option value=".es">.es（西班牙语）</option>
            <option value=".ko">.ko（韩语）</option>
            <option value=".de">.de（德语）</option>
            <option value=".fr">.fr（法语）</option>
            <option value=".th">.th（泰语）</option>
          </select>
        </label>
      </div>
      <div id="outputFolderConfigs" class="output-configs"></div>
      <div class="actions">
        <button type="button" id="btnReplace">按勾选开始替换</button>
      </div>
      <div class="status" id="statusReplace"></div>
    </section>
  </main>

  <!-- 上下文预览 Modal -->
  <div class="context-modal" id="contextModal" hidden>
    <div class="context-modal-backdrop"></div>
    <div class="context-modal-content">
      <div class="context-modal-header">
        <h3>上下文预览</h3>
        <button type="button" id="btnCloseContext" class="context-close">×</button>
      </div>
      <div class="context-modal-body" id="contextBody"></div>
    </div>
  </div>
  <script src="srt.js?v=6"></script>
  <script>
    let scanData = null;
    let selectedIds = new Set();
    let activeSource = null;
    let glossaryEntries = [];
    let subtitleFiles = [];
    let sourceType = null; // 'zip' | 'folder' | 'drop'
    let droppedSrtFiles = []; // files from drag-drop
    let multiTargetMap = {}; // source -> [target1, target2, ...]  (单语言模式)
    let hitTargetOverrides = {}; // hitId -> user-selected target (单语言模式)
    let allSubsByFile = {}; // { fileName: [subs] } 用于上下文查询

    // 多语言模式状态
    const LANG_OPTIONS = ['en', 'zh-CN', 'ja', 'ko', 'es', 'th', 'fr', 'de'];
    const LANG_LABELS = {
      'en': 'English', 'zh-CN': '简体中文', 'ja': '日本語', 'ko': '한국어',
      'es': 'Español', 'th': 'ไทย', 'fr': 'Français', 'de': 'Deutsch'
    };
    let glossaryFiles = [];   // [{ file: File, lang: 'en', outputFolder: 'en' }]
    let glossaryByLang = {}; // { en: entries[], ja: entries[] } — 扫描用，按语言合并
    let glossaryEntriesByIndex = []; // [entries] — 替换用，每个术语表独立
    let langHitValue = {};   // { en: { [hitId]: 'target' } }
    let multiLangMode = false;
    let activeLangs = [];    // 当前激活的语言列表

    const SOURCE_ALIASES = ['source', '中文', '原文', '源文', '词条', '术语', 'chinese', 'zh', '中文词条', '中文原文', '源'];
    const TARGET_ALIASES = ['target', '译文', '英文', '目标语', '翻译', 'english', 'en', '外语', '外文', '英文译名', '译名', '替换', '替换为', '替换内容', '目标文本', '目标'];

    const subsReplaceZip = document.getElementById('subsReplaceZip');
    const subsReplaceFolder = document.getElementById('subsReplaceFolder');
    const dropZoneReplace = document.getElementById('dropZoneReplace');
    const exportFolder = document.getElementById('exportFolder');
    const folderNameWrap = document.getElementById('folderNameWrap');
    const glossaryInput = document.getElementById('glossary');
    const glossaryList = document.getElementById('glossaryList');
    const langSuffixWrap = document.getElementById('langSuffix').closest('label');

    exportFolder.addEventListener('change', () => {
      // 多语言模式下，父文件夹名可选（留空 = 直接输出各子文件夹）
      if (multiLangMode) {
        folderNameWrap.hidden = false;
      } else {
        folderNameWrap.hidden = !exportFolder.checked;
      }
    });

    // 多语言术语表管理：每份绑定语言标签 + 输出文件夹名
    function addGlossaryFiles(fileList) {
      for (const f of fileList) {
        const used = glossaryFiles.map(g => g.lang);
        const lang = LANG_OPTIONS.find(l => !used.includes(l)) || LANG_OPTIONS[0];
        glossaryFiles.push({ file: f, lang, outputFolder: lang });
      }
      renderGlossaryList();
      renderOutputFolderConfigs();
    }

    function removeGlossary(idx) {
      glossaryFiles.splice(idx, 1);
      renderGlossaryList();
      renderOutputFolderConfigs();
    }

    function setGlossaryLang(idx, lang) {
      if (glossaryFiles[idx]) {
        glossaryFiles[idx].lang = lang;
        if (!glossaryFiles[idx]._folderCustom) glossaryFiles[idx].outputFolder = lang;
        renderGlossaryList();
        renderOutputFolderConfigs();
      }
    }

    function setGlossaryOutputFolder(idx, val) {
      if (glossaryFiles[idx]) {
        const trimmed = val.trim();
        if (trimmed) {
          glossaryFiles[idx].outputFolder = trimmed;
          glossaryFiles[idx]._folderCustom = true;
        } else {
          glossaryFiles[idx].outputFolder = glossaryFiles[idx].lang;
          glossaryFiles[idx]._folderCustom = false;
        }
      }
    }

    function renderOutputFolderConfigs() {
      const container = document.getElementById('outputFolderConfigs');
      if (!container) return;
      container.innerHTML = '';

      if (glossaryFiles.length < 2) {
        container.hidden = true;
        return;
      }

      container.hidden = false;
      const tip = document.createElement('div');
      tip.className = 'output-config-tip';
      tip.textContent = '每个术语表独立输出到自定义文件夹（文件名保持不变）：';
      container.appendChild(tip);

      glossaryFiles.forEach((g, idx) => {
        const row = document.createElement('div');
        row.className = 'output-config-row';

        const label = document.createElement('span');
        label.className = 'output-config-label';
        label.textContent = g.file.name;
        label.title = g.file.name;

        const langTag = document.createElement('span');
        langTag.className = 'output-config-lang';
        langTag.textContent = g.lang;

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'output-config-input';
        input.value = g.outputFolder || g.lang;
        input.placeholder = '文件夹名';
        input.title = '替换后输出到此文件夹';
        input.onchange = () => {
          setGlossaryOutputFolder(idx, input.value);
        };

        row.appendChild(label);
        row.appendChild(langTag);
        row.appendChild(input);
        container.appendChild(row);
      });
    }

    function getActiveLangs() {
      const seen = new Set();
      const out = [];
      for (const g of glossaryFiles) {
        if (!seen.has(g.lang)) { seen.add(g.lang); out.push(g.lang); }
      }
      return out;
    }

    function renderGlossaryList() {
      glossaryList.innerHTML = '';
      glossaryFiles.forEach((g, idx) => {
        const li = document.createElement('li');
        li.className = 'glossary-item';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'glossary-name';
        nameSpan.textContent = g.file.name;
        nameSpan.title = g.file.name;

        const langSelect = document.createElement('select');
        langSelect.className = 'glossary-lang';
        LANG_OPTIONS.forEach(l => {
          const opt = document.createElement('option');
          opt.value = l;
          opt.textContent = `${l} · ${LANG_LABELS[l] || ''}`;
          if (l === g.lang) opt.selected = true;
          langSelect.appendChild(opt);
        });
        langSelect.onchange = () => setGlossaryLang(idx, langSelect.value);

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'glossary-remove';
        removeBtn.textContent = '×';
        removeBtn.title = '移除该术语表';
        removeBtn.onclick = () => removeGlossary(idx);

        li.appendChild(nameSpan);
        li.appendChild(langSelect);
        li.appendChild(removeBtn);
        glossaryList.appendChild(li);
      });
    }

    glossaryInput.addEventListener('change', (e) => {
      if (e.target.files.length === 0) return;
      addGlossaryFiles(e.target.files);
      // 允许再次选择同名文件触发 change
      e.target.value = '';
    });

    dropZoneReplace.addEventListener('click', (e) => {
      const rect = dropZoneReplace.getBoundingClientRect();
      const y = e.clientY - rect.top;
      if (y < rect.height / 2) {
        subsReplaceZip.click();
      } else {
        subsReplaceFolder.click();
      }
    });

    subsReplaceZip.addEventListener('change', (e) => {
      if (e.target.files.length > 0) sourceType = 'zip';
    });
    subsReplaceFolder.addEventListener('change', (e) => {
      if (e.target.files.length > 0) sourceType = 'folder';
    });

    ['dragover', 'dragenter'].forEach(evt => {
      dropZoneReplace.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZoneReplace.classList.add('drag-over');
      });
    });
    ['dragleave', 'drop'].forEach(evt => {
      dropZoneReplace.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZoneReplace.classList.remove('drag-over');
      });
    });
    dropZoneReplace.addEventListener('drop', async (e) => {
      sourceType = 'drop';
      try {
        droppedSrtFiles = await extractSrtFromDropEvent(e);
        if (droppedSrtFiles.length === 0) {
          alert('拖入的内容中未找到 SRT 文件');
          sourceType = null;
          droppedSrtFiles = [];
        } else {
          statusScan.className = 'status ok';
          statusScan.textContent = `已识别 ${droppedSrtFiles.length} 个 SRT 文件，请点击"扫描替换位置"`;
        }
      } catch (err) {
        alert('读取拖入内容失败：' + err.message);
        sourceType = null;
        droppedSrtFiles = [];
      }
    });

    function normalizeHeader(name) {
      return String(name).trim().toLowerCase().replace(/\s+/g, '');
    }

    function findColumn(sheet, aliases) {
      const headerRow = sheet[0] || [];
      for (let i = 0; i < headerRow.length; i++) {
        const normalized = normalizeHeader(headerRow[i]);
        if (aliases.includes(normalized)) {
          return i;
        }
      }
      return -1;
    }

    async function loadGlossary(file) {
      const arrayBuffer = await file.arrayBuffer();
      const data = new Uint8Array(arrayBuffer);
      const workbook = XLSX.read(data, { type: 'array' });

      let targetSheet = null;
      for (const sheetName of workbook.SheetNames) {
        const sheet = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1 });
        const sourceCol = findColumn(sheet, SOURCE_ALIASES);
        const targetCol = findColumn(sheet, TARGET_ALIASES);
        if (sourceCol >= 0 && targetCol >= 0) {
          targetSheet = { name: sheetName, data: sheet, sourceCol, targetCol };
          break;
        }
      }

      if (!targetSheet) {
        throw new Error('未找到 Source 和 Target 列，请检查术语表格式');
      }

      const entries = [];
      const sourceTargetMap = {}; // source -> Set of targets
      const { data: sheet, sourceCol, targetCol } = targetSheet;

      for (let rowIdx = 1; rowIdx < sheet.length; rowIdx++) {
        const row = sheet[rowIdx];
        if (!row || !row[sourceCol]) continue;

        const source = String(row[sourceCol]).trim();
        const target = String(row[targetCol] || '').trim();

        if (!source) continue;
        if (!target) continue;

        const parts = source.split(/[/\\]+/).map(p => p.trim()).filter(p => p);

        for (const part of parts) {
          entries.push({
            source: part,
            target: target,
            priority: 0,
            matchType: 'phrase',
            blockIfLonger: true
          });
          if (!sourceTargetMap[part]) sourceTargetMap[part] = new Set();
          sourceTargetMap[part].add(target);
        }
      }

      // 检测同一 Source 有多个不同 Target 的情况
      const multiTargetMap = {};
      for (const [src, targets] of Object.entries(sourceTargetMap)) {
        if (targets.size > 1) {
          multiTargetMap[src] = [...targets];
        }
      }

      // 去重：同一 Source 只保留第一条词条（Target 由用户选择覆盖）
      const seenSources = new Set();
      const dedupedEntries = [];
      for (const entry of entries) {
        if (!seenSources.has(entry.source)) {
          seenSources.add(entry.source);
          dedupedEntries.push(entry);
        }
      }

      return { entries: dedupedEntries, sheetName: targetSheet.name, multiTargetMap };
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function allHitIds() {
      const ids = [];
      (scanData?.terms || []).forEach((t) => t.hits.forEach((h) => ids.push(h.id)));
      return ids;
    }

    function renderTermList() {
      termList.innerHTML = '';
      (scanData?.terms || []).forEach((t) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'term-item' + (t.source === activeSource ? ' active' : '');
        const multiBadge = multiTargetMap[t.source]
          ? ` <span class="multi-badge" title="该词有 ${multiTargetMap[t.source].length} 个可选 Target">多</span>`
          : '';
        b.innerHTML = esc(t.source) + multiBadge + ` <span class="cnt">${t.hits.length}</span>`;
        b.onclick = () => { activeSource = t.source; renderTermList(); renderHits(); updateTargetSelector(); };
        termList.appendChild(b);
      });
    }

    function updateTargetSelector() {
      const wrap = document.getElementById('targetSelectorWrap');
      const select = document.getElementById('targetSelect');
      const targets = multiTargetMap[activeSource];

      if (targets && targets.length > 1) {
        wrap.hidden = false;
        select.innerHTML = '';
        targets.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t;
          opt.textContent = t;
          select.appendChild(opt);
        });
      } else {
        wrap.hidden = true;
      }
    }

    // 批量应用到本词全部命中
    document.getElementById('btnApplyTargetAll').addEventListener('click', () => {
      const term = (scanData?.terms || []).find((t) => t.source === activeSource);
      if (!term) return;
      const target = document.getElementById('targetSelect').value;
      term.hits.forEach(h => {
        hitTargetOverrides[h.id] = target;
      });
      renderHits();
      statusScan.className = 'status ok';
      statusScan.textContent = `已将本词全部 ${term.hits.length} 处命中统一替换为：${target}`;
    });

    function renderHits() {
      // 多语言模式分发
      if (multiLangMode) return renderHitsMulti();
      const term = (scanData?.terms || []).find((t) => t.source === activeSource);
      hitBody.innerHTML = '';
      if (!term) return;

      const hasMultiTargets = multiTargetMap[term.source] && multiTargetMap[term.source].length > 1;
      const targets = hasMultiTargets ? multiTargetMap[term.source] : null;

      let allOn = true;
      term.hits.forEach((h) => {
        if (!selectedIds.has(h.id)) allOn = false;
        const tr = document.createElement('tr');
        tr.className = 'hit-row';
        tr.dataset.hitId = h.id;

        const ck = document.createElement('input');
        ck.type = 'checkbox';
        ck.checked = selectedIds.has(h.id);
        ck.onchange = () => {
          if (ck.checked) {
            selectedIds.add(h.id);
          } else {
            selectedIds.delete(h.id);
          }
          chkTermAll.checked = term.hits.every((x) => selectedIds.has(x.id));
          chkGlobalAll.checked = allHitIds().every((id) => selectedIds.has(id));
        };

        // 替换为单元格：select / 固定文本 + 自定义输入框
        const selectTarget = hitTargetOverrides[h.id] || h.target;
        let selectHtml;
        if (targets) {
          selectHtml = `<select class="hit-target-select" data-hit-id="${esc(h.id)}">` +
            targets.map(t => `<option value="${esc(t)}" ${t === selectTarget ? 'selected' : ''}>${esc(t)}</option>`).join('') +
            `</select>`;
        } else {
          selectHtml = `<span class="hit-target-fixed">${esc(h.target)}</span>`;
        }

        // 自定义输入框：有值则覆盖 select 选择
        const customValue = hitTargetOverrides[h.id] && !targets.includes(hitTargetOverrides[h.id])
          ? hitTargetOverrides[h.id]
          : '';
        const inputHtml = `<input type="text" class="hit-target-custom" data-hit-id="${esc(h.id)}" 
          placeholder="自定义…" value="${esc(customValue)}" title="输入自定义替换内容，留空则使用上方选择" />`;

        targetCellHtml = `<div class="target-cell-wrap">${selectHtml}${inputHtml}</div>`;

        // 实际生效的 Target：优先自定义输入框值，其次 select 选择，最后默认
        const effectiveTarget = hitTargetOverrides[h.id] || h.target;
        const highlighted = highlightHit(h.line_text, h.start, h.end, h.source, effectiveTarget);

        tr.innerHTML =
          `<td></td><td>${esc(h.file)}</td><td>${h.line_no}</td><td>${esc(h.timecode)}</td><td class="target-cell">${targetCellHtml}</td><td class="text-cell">${highlighted}</td>`;
        tr.cells[0].appendChild(ck);
        hitBody.appendChild(tr);

        // 仅点击原文句单元格查看上下文（其他列不触发）
        const textCell = tr.querySelector('.text-cell');
        if (textCell) {
          textCell.addEventListener('click', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'OPTION') return;
            showContextModal(h);
          });
        }
      });

      // 每行 select 变化
      hitBody.querySelectorAll('.hit-target-select').forEach(sel => {
        sel.addEventListener('change', (e) => {
          const hitId = e.target.dataset.hitId;
          hitTargetOverrides[hitId] = e.target.value;
          // 清空自定义输入框
          const tr = e.target.closest('tr');
          const customInput = tr.querySelector('.hit-target-custom');
          if (customInput) customInput.value = '';
          // 更新该行预览
          const h = term.hits.find(x => x.id === hitId);
          if (h) {
            const textCell = tr.querySelector('.text-cell');
            textCell.innerHTML = highlightHit(h.line_text, h.start, h.end, h.source, e.target.value);
          }
        });
      });

      // 每行自定义输入框变化
      hitBody.querySelectorAll('.hit-target-custom').forEach(inp => {
        inp.addEventListener('input', (e) => {
          const hitId = e.target.dataset.hitId;
          const val = e.target.value.trim();
          if (val) {
            hitTargetOverrides[hitId] = val;
          } else {
            // 输入框清空时回退到 select 当前值
            const tr = e.target.closest('tr');
            const sel = tr.querySelector('.hit-target-select');
            if (sel) {
              hitTargetOverrides[hitId] = sel.value;
            } else {
              const h = term.hits.find(x => x.id === hitId);
              if (h) hitTargetOverrides[hitId] = h.target;
            }
          }
          // 更新该行预览
          const tr = e.target.closest('tr');
          const h = term.hits.find(x => x.id === hitId);
          if (h) {
            const effectiveTarget = val || (tr.querySelector('.hit-target-select')?.value || h.target);
            const textCell = tr.querySelector('.text-cell');
            textCell.innerHTML = highlightHit(h.line_text, h.start, h.end, h.source, effectiveTarget);
          }
        });
      });

      chkTermAll.checked = allOn;
    }

    // 上下文 Modal
    const contextModal = document.getElementById('contextModal');
    const contextBody = document.getElementById('contextBody');
    document.getElementById('btnCloseContext').addEventListener('click', () => contextModal.hidden = true);
    contextModal.querySelector('.context-modal-backdrop').addEventListener('click', () => contextModal.hidden = true);

    function showContextModal(h) {
      const ctx = h.context || { before: [], after: [] };
      const effectiveTarget = hitTargetOverrides[h.id] || h.target;

      const renderLine = (item, isCurrent) => {
        const cls = isCurrent ? 'ctx-line current' : 'ctx-line';
        let textHtml;
        if (isCurrent) {
          textHtml = highlightHit(item.text, h.start, h.end, h.source, effectiveTarget);
        } else {
          textHtml = esc(item.text);
        }
        return `<div class="${cls}">
          <span class="ctx-line-no">${item.line_no}</span>
          <span class="ctx-time">${esc(item.timecode)}</span>
          <span class="ctx-text">${textHtml}</span>
        </div>`;
      };

      const beforeHtml = (ctx.before || []).map(b => renderLine(b, false)).join('');
      const currentHtml = renderLine({ line_no: h.line_no, timecode: h.timecode, text: h.line_text }, true);
      const afterHtml = (ctx.after || []).map(a => renderLine(a, false)).join('');

      contextBody.innerHTML = `
        <div class="ctx-file">${esc(h.file)} · 第 ${h.line_no} 条</div>
        <div class="ctx-list">
          ${beforeHtml}
          ${currentHtml}
          ${afterHtml}
        </div>
        <div class="ctx-legend">
          <span class="hit-source">${esc(h.source)}</span>
          <span class="hit-arrow">→</span>
          <span class="hit-target">${esc(effectiveTarget)}</span>
        </div>
      `;
      contextModal.hidden = false;
    }

    function highlightHit(text, start, end, source, target) {
      const before = esc(text.substring(0, start));
      const highlighted = `<span class="hit-source">${esc(source)}</span><span class="hit-arrow">→</span><span class="hit-target">${esc(target)}</span>`;
      const after = esc(text.substring(end));
      return before + highlighted + after;
    }

    async function loadSubtitleFiles() {
      subtitleFiles = [];
      
      if (sourceType === 'zip') {
        const z = subsReplaceZip.files[0];
        if (!z) throw new Error('请选择 ZIP 文件');
        const arrayBuffer = await z.arrayBuffer();
        const zip = await JSZip.loadAsync(arrayBuffer);
        for (const [name, file] of Object.entries(zip.files)) {
          if (file.dir || !name.toLowerCase().endsWith('.srt')) continue;
          const content = await file.async('string');
          subtitleFiles.push({ name, content });
        }
      } else if (sourceType === 'folder') {
        const items = extractSrtFromFileList(subsReplaceFolder.files);
        for (const item of items) {
          const content = await item.file.text();
          subtitleFiles.push({ name: item.name, content });
        }
      } else if (sourceType === 'drop') {
        for (const item of droppedSrtFiles) {
          const content = await item.file.text();
          subtitleFiles.push({ name: item.name, content });
        }
      } else {
        throw new Error('请选择或拖入字幕文件');
      }

      // 按文件名数字大小自然排序（ep1, ep2, ..., ep10）
      subtitleFiles.sort((a, b) => naturalCompare(a.name, b.name));

      if (subtitleFiles.length === 0) {
        throw new Error('未找到 SRT 文件');
      }
    }

    btnScan.onclick = async () => {
      if (glossaryFiles.length === 0) return alert('请上传本地化清单');
      if (!sourceType) return alert('请上传或拖入字幕（ZIP / 文件夹）');

      // 多语言模式判定：≥2 份术语表且至少 2 个不同语言
      const langs = getActiveLangs();
      multiLangMode = glossaryFiles.length >= 2 && langs.length >= 2;
      activeLangs = multiLangMode ? langs : [];
      if (langSuffixWrap) langSuffixWrap.hidden = multiLangMode;

      if (multiLangMode) {
        await scanMultiLanguage();
        return;
      }

      const g = glossaryFiles[0]?.file;
      statusScan.className = 'status';
      statusScan.textContent = '扫描中…';
      btnScan.disabled = true;

      try {
        const glossResult = await loadGlossary(g);
        glossaryEntries = glossResult.entries;
        multiTargetMap = glossResult.multiTargetMap || {};
        hitTargetOverrides = {};
        allSubsByFile = {};

        await loadSubtitleFiles();

        const terms = {};
        let totalHits = 0;

        const limit = preview.checked ? 1 : subtitleFiles.length;

        for (let i = 0; i < limit; i++) {
          const subFile = subtitleFiles[i];
          const subs = parseSrt(subFile.content);
          const outName = subFile.name.split('/').pop();
          allSubsByFile[outName] = subs;

          for (let j = 0; j < subs.length; j++) {
            const line = subs[j];
            if (!line.text || !line.text.trim()) continue;

            const text = line.text.replace(/\n/g, ' ');
            const { hits } = scanTextHits(text, glossaryEntries);

            const tc = formatTimecode(line.start);

            // 准备上下文（前后各 2 行）
            const ctxBefore = [];
            for (let k = Math.max(0, j - 2); k < j; k++) {
              ctxBefore.push({
                line_no: k + 1,
                timecode: formatTimecode(subs[k].start),
                text: (subs[k].text || '').replace(/\n/g, ' ')
              });
            }
            const ctxAfter = [];
            for (let k = j + 1; k < Math.min(subs.length, j + 3); k++) {
              ctxAfter.push({
                line_no: k + 1,
                timecode: formatTimecode(subs[k].start),
                text: (subs[k].text || '').replace(/\n/g, ' ')
              });
            }

            for (const h of hits) {
              const src = h.source;
              const bucket = terms[src] || { source: src, target: h.target, hits: [] };

              bucket.hits.push({
                id: `${outName}|${j + 1}|${h.start}|${h.end}|${src}`,
                file: outName,
                line_no: j + 1,
                timecode: tc,
                line_text: text,
                source: h.source,
                target: h.target,
                start: h.start,
                end: h.end,
                context: { before: ctxBefore, after: ctxAfter }
              });

              totalHits++;
              terms[src] = bucket;
            }
          }
        }

        const termList = Object.values(terms).sort((a, b) => {
          if (b.hits.length !== a.hits.length) return b.hits.length - a.hits.length;
          return b.source.length - a.source.length;
        });

        scanData = {
          sheet_name: glossResult.sheetName,
          term_count: termList.length,
          hit_count: totalHits,
          terms: termList
        };

        selectedIds = new Set(allHitIds());
        activeSource = scanData.terms[0]?.source || null;

        const multiCount = Object.keys(multiTargetMap).length;
        const multiHint = multiCount > 0
          ? ` | <span style="color:#c7870f">⚠ ${multiCount} 个词有多个可选 Target，可在每条命中行单独选择</span>`
          : '';
        scanSummary.innerHTML = `工作表: ${scanData.sheet_name} | ${scanData.term_count} 个词，${scanData.hit_count} 处命中${multiHint}`;
        scanLayout.hidden = !scanData.term_count;
        renderTermList();
        renderHits();
        updateTargetSelector();
        chkGlobalAll.checked = true;

        statusScan.className = 'status ok';
        statusScan.textContent = '扫描完成，请勾选后执行替换';
      } catch (e) {
        statusScan.className = 'status err';
        statusScan.textContent = e.message;
      } finally {
        btnScan.disabled = false;
      }
    };

    // ===== 多语言模式：扫描 / 渲染 / 替换 =====
    async function scanMultiLanguage() {
      statusScan.className = 'status';
      statusScan.textContent = '扫描中…';
      btnScan.disabled = true;
      try {
        // 加载每个 glossary：独立存储 + 按语言合并（同语言多份文件合并条目用于扫描）
        glossaryEntriesByIndex = [];
        glossaryByLang = {};
        for (const g of glossaryFiles) {
          const r = await loadGlossary(g.file);
          glossaryEntriesByIndex.push(r.entries);
          if (glossaryByLang[g.lang]) {
            glossaryByLang[g.lang] = [...glossaryByLang[g.lang], ...r.entries];
          } else {
            glossaryByLang[g.lang] = r.entries;
          }
        }

        langHitValue = {};
        activeLangs.forEach(l => { langHitValue[l] = {}; });

        hitTargetOverrides = {};
        allSubsByFile = {};

        await loadSubtitleFiles();

        const terms = {};
        let totalHits = 0;
        const limit = preview.checked ? 1 : subtitleFiles.length;

        for (let i = 0; i < limit; i++) {
          const subFile = subtitleFiles[i];
          const subs = parseSrt(subFile.content);
          const outName = subFile.name.split('/').pop();
          allSubsByFile[outName] = subs;

          for (let j = 0; j < subs.length; j++) {
            const line = subs[j];
            if (!line.text || !line.text.trim()) continue;

            const text = line.text.replace(/\n/g, ' ');
            const tc = formatTimecode(line.start);

            const ctxBefore = [];
            for (let k = Math.max(0, j - 2); k < j; k++) {
              ctxBefore.push({
                line_no: k + 1,
                timecode: formatTimecode(subs[k].start),
                text: (subs[k].text || '').replace(/\n/g, ' ')
              });
            }
            const ctxAfter = [];
            for (let k = j + 1; k < Math.min(subs.length, j + 3); k++) {
              ctxAfter.push({
                line_no: k + 1,
                timecode: formatTimecode(subs[k].start),
                text: (subs[k].text || '').replace(/\n/g, ' ')
              });
            }

            // 每语言独立扫描，按 hitId 合并
            const mergedHits = {};
            for (const lang of activeLangs) {
              const { hits } = scanTextHits(text, glossaryByLang[lang]);
              for (const h of hits) {
                const id = `${outName}|${j + 1}|${h.start}|${h.end}|${h.source}`;
                if (!mergedHits[id]) {
                  mergedHits[id] = {
                    id,
                    file: outName,
                    line_no: j + 1,
                    timecode: tc,
                    line_text: text,
                    source: h.source,
                    start: h.start,
                    end: h.end,
                    context: { before: ctxBefore, after: ctxAfter },
                    targets: {}
                  };
                }
                mergedHits[id].targets[lang] = h.target;
                // 初始化 langHitValue：默认值 = glossary target
                if (!(id in langHitValue[lang])) {
                  langHitValue[lang][id] = h.target;
                }
              }
            }

            // 把合并后的 hit 按 source 聚合
            for (const h of Object.values(mergedHits)) {
              const src = h.source;
              const bucket = terms[src] || { source: src, hits: [] };
              bucket.hits.push(h);
              totalHits++;
              terms[src] = bucket;
            }
          }
        }

        const termList = Object.values(terms).sort((a, b) => {
          if (b.hits.length !== a.hits.length) return b.hits.length - a.hits.length;
          return b.source.length - a.source.length;
        });

        scanData = {
          sheet_name: glossaryFiles.map(g => g.file.name).join(' + '),
          term_count: termList.length,
          hit_count: totalHits,
          terms: termList
        };

        selectedIds = new Set(allHitIds());
        activeSource = scanData.terms[0]?.source || null;

        const langBadges = activeLangs.map(l => `<span class="lang-badge">${esc(l)}</span>`).join('');
        scanSummary.innerHTML = `多语言模式 | ${scanData.term_count} 个词，${scanData.hit_count} 处命中 | <span class="lang-badge-row">${langBadges}</span>`;
        scanLayout.hidden = !scanData.term_count;

        renderTermList();
        renderHitHeaderMulti();
        renderHitsMulti();
        // 多语言模式不显示单语言的"批量替换为"控件
        document.getElementById('targetSelectorWrap').hidden = true;
        chkGlobalAll.checked = true;

        statusScan.className = 'status ok';
        statusScan.textContent = `扫描完成：${activeLangs.length} 个语言，请勾选后执行替换`;
      } catch (e) {
        statusScan.className = 'status err';
        statusScan.textContent = e.message;
      } finally {
        btnScan.disabled = false;
      }
    }

    function renderHitHeaderMulti() {
      const headRow = document.getElementById('hitHeadRow');
      let html = '<th>选</th><th>文件</th><th>句序</th><th>时间</th><th>Source</th>';
      for (const lang of activeLangs) {
        html += `<th class="lang-th" title="${esc(LANG_LABELS[lang] || '')}">${esc(lang)}</th>`;
      }
      html += '<th>原文句（点击查看上下文）</th>';
      headRow.innerHTML = html;
    }

    function renderHitsMulti() {
      // 重置表头（用户切换 term 时保证表头一致）
      renderHitHeaderMulti();
      const term = (scanData?.terms || []).find((t) => t.source === activeSource);
      hitBody.innerHTML = '';
      if (!term) return;

      let allOn = true;
      term.hits.forEach((h) => {
        if (!selectedIds.has(h.id)) allOn = false;
        const tr = document.createElement('tr');
        tr.className = 'hit-row';
        tr.dataset.hitId = h.id;

        const ck = document.createElement('input');
        ck.type = 'checkbox';
        ck.checked = selectedIds.has(h.id);
        ck.onchange = () => {
          if (ck.checked) selectedIds.add(h.id);
          else selectedIds.delete(h.id);
          chkTermAll.checked = term.hits.every((x) => selectedIds.has(x.id));
          chkGlobalAll.checked = allHitIds().every((id) => selectedIds.has(id));
        };

        const sourceCellHtml = `<span class="hit-source">${esc(h.source)}</span>`;

        const langCellsHtml = activeLangs.map(lang => {
          const val = langHitValue[lang]?.[h.id];
          if (val === undefined) {
            // 该语言 glossary 未覆盖此 Source
            return `<td class="lang-col lang-empty" title="该语言术语表未覆盖此 Source">—</td>`;
          }
          const v = esc(val || '');
          return `<td class="lang-col"><input type="text" class="lang-target-input" data-hit-id="${esc(h.id)}" data-lang="${esc(lang)}" value="${v}" placeholder="—" title="留空 = 该语言跳过此 hit；编辑 = 用该值替换" /></td>`;
        }).join('');

        // 原文句高亮：用第一个非空 target 做 preview
        const previewLang = activeLangs.find(l => langHitValue[l]?.[h.id] !== undefined && langHitValue[l][h.id] !== '') || activeLangs[0];
        const previewTarget = langHitValue[previewLang]?.[h.id] || h.targets[previewLang] || '';
        const highlighted = highlightHit(h.line_text, h.start, h.end, h.source, previewTarget);

        tr.innerHTML =
          `<td></td><td>${esc(h.file)}</td><td>${h.line_no}</td><td>${esc(h.timecode)}</td>` +
          `<td>${sourceCellHtml}</td>${langCellsHtml}<td class="text-cell">${highlighted}</td>`;
        tr.cells[0].appendChild(ck);
        hitBody.appendChild(tr);

        const textCell = tr.querySelector('.text-cell');
        if (textCell) {
          textCell.addEventListener('click', (e) => {
            if (['INPUT', 'SELECT', 'OPTION'].includes(e.target.tagName)) return;
            showContextModalMulti(h);
          });
        }
      });

      // 每语言 Target 输入框 input 事件
      hitBody.querySelectorAll('.lang-target-input').forEach(inp => {
        inp.addEventListener('input', (e) => {
          const hitId = e.target.dataset.hitId;
          const lang = e.target.dataset.lang;
          if (!langHitValue[lang]) langHitValue[lang] = {};
          langHitValue[lang][hitId] = e.target.value;
        });
      });

      chkTermAll.checked = allOn;
    }

    function showContextModalMulti(h) {
      const ctx = h.context || { before: [], after: [] };

      const renderLine = (item, isCurrent) => {
        const cls = isCurrent ? 'ctx-line current' : 'ctx-line';
        let textHtml;
        if (isCurrent) {
          const pl = activeLangs.find(l => langHitValue[l]?.[h.id] !== undefined && langHitValue[l][h.id] !== '') || activeLangs[0];
          const pt = langHitValue[pl]?.[h.id] || h.targets[pl] || '';
          textHtml = highlightHit(item.text, h.start, h.end, h.source, pt);
        } else {
          textHtml = esc(item.text);
        }
        return `<div class="${cls}">
          <span class="ctx-line-no">${item.line_no}</span>
          <span class="ctx-time">${esc(item.timecode)}</span>
          <span class="ctx-text">${textHtml}</span>
        </div>`;
      };

      const beforeHtml = (ctx.before || []).map(b => renderLine(b, false)).join('');
      const currentHtml = renderLine({ line_no: h.line_no, timecode: h.timecode, text: h.line_text }, true);
      const afterHtml = (ctx.after || []).map(a => renderLine(a, false)).join('');

      // 多语言 legend：列出每个语言的 (source → target) 状态
      const legendHtml = activeLangs.map(lang => {
        const v = langHitValue[lang]?.[h.id];
        if (v === undefined) {
          return `<div class="ctx-legend"><span class="lang-badge">${esc(lang)}</span> <span class="hit-source">${esc(h.source)}</span> <span class="hit-arrow">→</span> <span style="color:var(--text-soft)">未覆盖</span></div>`;
        }
        if (v === '') {
          return `<div class="ctx-legend"><span class="lang-badge">${esc(lang)}</span> <span class="hit-source">${esc(h.source)}</span> <span class="hit-arrow">→</span> <span style="color:var(--text-soft)">跳过</span></div>`;
        }
        return `<div class="ctx-legend"><span class="lang-badge">${esc(lang)}</span> <span class="hit-source">${esc(h.source)}</span> <span class="hit-arrow">→</span> <span class="hit-target">${esc(v)}</span></div>`;
      }).join('');

      contextBody.innerHTML = `
        <div class="ctx-file">${esc(h.file)} · 第 ${h.line_no} 条</div>
        <div class="ctx-list">
          ${beforeHtml}
          ${currentHtml}
          ${afterHtml}
        </div>
        <div class="ctx-legend-list">
          ${legendHtml}
        </div>
      `;
      contextModal.hidden = false;
    }

    async function replaceMulti() {
      statusReplace.className = 'status';
      statusReplace.textContent = '替换中…';
      btnReplace.disabled = true;

      try {
        const outZip = new JSZip();
        const outputFiles = [];
        const useFolderExport = exportFolder.checked;
        const rawFolderName = document.getElementById('folderName').value.trim();
        const parentFolder = rawFolderName ? rawFolderName.replace(/[\\/:*?"<>|]/g, '_') : '';
        const limit = preview.checked ? 1 : subtitleFiles.length;

        for (let gi = 0; gi < glossaryFiles.length; gi++) {
          const g = glossaryFiles[gi];
          const entries = glossaryEntriesByIndex[gi];
          const outputFolder = (g.outputFolder || g.lang).replace(/[\\/:*?"<>|]/g, '_');

          const overrides = {};
          const allowed = new Set();
          for (const id of selectedIds) {
            const v = langHitValue[g.lang]?.[id];
            if (v === undefined) continue;
            if (v === '') continue;
            allowed.add(id);
            overrides[id] = v;
          }

          for (let i = 0; i < limit; i++) {
            const subFile = subtitleFiles[i];
            const subs = parseSrt(subFile.content);
            const originalName = subFile.name.split('/').pop();

            for (let j = 0; j < subs.length; j++) {
              const line = subs[j];
              if (!line.text) continue;

              const original = line.text;
              const text = original.replace(/\n/g, ' ');
              const { text: replaced } = replaceText(text, entries, {
                allowedHitIds: allowed,
                hitTargetOverrides: overrides,
                fileName: originalName,
                lineIndex: j + 1
              });
              line.text = replaced;
            }

            if (alsoFix.checked) {
              for (const line of subs) {
                if (line.text) {
                  line.text = line.text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                  const parts = line.text.split('\n').map(p => p.trim()).filter(p => p);
                  line.text = parts.join('\n');
                }
                if (line.end <= line.start) {
                  line.end = line.start + 2000;
                }
              }
            }

            const outContent = generateSrt(subs);
            const relPath = parentFolder
              ? `${parentFolder}/${outputFolder}/${originalName}`
              : `${outputFolder}/${originalName}`;
            outZip.file(relPath, outContent);
            outputFiles.push({ path: relPath, content: outContent });
          }
        }

        if (useFolderExport) {
          if (!window.showDirectoryPicker) {
            throw new Error('当前浏览器不支持文件夹导出，请使用 Chrome/Edge，或取消勾选"导出为文件夹"');
          }
          const result = await saveFilesToFolder(outputFiles);
          if (!result.success) throw new Error(result.message);
          statusReplace.className = 'status ok';
          const folderList = glossaryFiles.map(g => (g.outputFolder || g.lang)).join('、');
          statusReplace.textContent = `${result.message}（${glossaryFiles.length} 个术语表输出：${folderList}）`;
        } else {
          const blob = await outZip.generateAsync({ type: 'blob' });
          downloadBlob(blob, 'replace_result_multi.zip');
          statusReplace.className = 'status ok';
          statusReplace.textContent = `已完成，下载已开始（${glossaryFiles.length} 个术语表，各输出到自定义文件夹）`;
        }
      } catch (e) {
        statusReplace.className = 'status err';
        statusReplace.textContent = e.message;
      } finally {
        btnReplace.disabled = false;
      }
    }

    chkTermAll.onchange = () => {
      const term = (scanData?.terms || []).find((t) => t.source === activeSource);
      if (!term) return;
      term.hits.forEach((h) => {
        if (chkTermAll.checked) selectedIds.add(h.id); else selectedIds.delete(h.id);
      });
      renderHits();
      chkGlobalAll.checked = allHitIds().every((id) => selectedIds.has(id));
    };

    chkGlobalAll.onchange = () => {
      if (chkGlobalAll.checked) {
        allHitIds().forEach((id) => selectedIds.add(id));
      } else {
        selectedIds.clear();
      }
      renderHits();
    };

    btnReplace.onclick = async () => {
      if (multiLangMode) {
        if (glossaryFiles.length === 0) return alert('请上传本地化清单');
        if (!sourceType || subtitleFiles.length === 0) return alert('请先扫描字幕');
        if (scanData && selectedIds.size === 0) return alert('请至少勾选一处替换');
        // 刷新输出配置（以防术语表列表有变更）
        renderOutputFolderConfigs();
        return replaceMulti();
      }
      const g = glossaryFiles[0]?.file;
      if (!g) return alert('请上传本地化清单');
      if (!sourceType || subtitleFiles.length === 0) return alert('请先扫描字幕');
      if (scanData && selectedIds.size === 0) return alert('请至少勾选一处替换');
      
      statusReplace.className = 'status';
      statusReplace.textContent = '替换中…';
      btnReplace.disabled = true;
      
      try {
        const outZip = new JSZip();
        const outputFiles = []; // for folder export
        const useFolderExport = exportFolder.checked;

        // 构建带用户选择 Target 的有效词条（仅作 Source 池，每个 hit 的 Target 由 hitTargetOverrides 覆盖）
        const effectiveEntries = glossaryEntries;

        const limit = preview.checked ? 1 : subtitleFiles.length;

        const suffix = document.getElementById('langSuffix').value;
        const rawFolderName = document.getElementById('folderName').value.trim();
        const folderName = (rawFolderName || 'replaced').replace(/[\\/:*?"<>|]/g, '_');

        for (let i = 0; i < limit; i++) {
          const subFile = subtitleFiles[i];
          const subs = parseSrt(subFile.content);
          const originalName = subFile.name.split('/').pop();
          const outName = suffix
            ? originalName.replace(/\.srt$/i, suffix + '.srt')
            : originalName;

          for (let j = 0; j < subs.length; j++) {
            const line = subs[j];
            if (!line.text) continue;

            const original = line.text;
            const text = original.replace(/\n/g, ' ');
            const { text: replaced } = replaceText(text, effectiveEntries, {
              allowedHitIds: selectedIds,
              hitTargetOverrides: hitTargetOverrides,
              fileName: originalName,
              lineIndex: j + 1
            });

            line.text = replaced;
          }
          
          if (alsoFix.checked) {
            for (const line of subs) {
              if (line.text) {
                line.text = line.text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                const parts = line.text.split('\n').map(p => p.trim()).filter(p => p);
                line.text = parts.join('\n');
              }
              if (line.end <= line.start) {
                line.end = line.start + 2000;
              }
            }
          }
          
          const outContent = generateSrt(subs);
          const relPath = folderName + '/' + outName;
          outZip.file(relPath, outContent);
          outputFiles.push({ path: relPath, content: outContent });
        }

        if (useFolderExport) {
          if (!window.showDirectoryPicker) {
            throw new Error('当前浏览器不支持文件夹导出，请使用 Chrome/Edge，或取消勾选"导出为文件夹"');
          }
          const result = await saveFilesToFolder(outputFiles);
          if (!result.success) throw new Error(result.message);
          statusReplace.className = 'status ok';
          statusReplace.textContent = `${result.message}（位于 ${folderName}/ 文件夹内）`;
        } else {
          const blob = await outZip.generateAsync({ type: 'blob' });
          const zipName = suffix ? `replace_result${suffix}.zip` : 'replace_result.zip';
          downloadBlob(blob, zipName);
          statusReplace.className = 'status ok';
          statusReplace.textContent = '已完成，下载已开始';
        }
      } catch (e) {
        statusReplace.className = 'status err';
        statusReplace.textContent = e.message;
      } finally {
        btnReplace.disabled = false;
      }
    };

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
