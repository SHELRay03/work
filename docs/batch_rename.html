<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>批量重命名 · 字幕工具箱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>
  <header class="hud-top">
    <a href="index.html" class="brand"><span class="brand-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="4" width="12" height="1.5" rx=".5" fill="#fafffd"/><rect x="2" y="7.25" width="9" height="1.5" rx=".5" fill="#fafffd" opacity=".9"/><rect x="2" y="10.5" width="11" height="1.5" rx=".5" fill="#fafffd" opacity=".75"/></svg>
      </span>字幕工具箱</a>
    <nav class="hud-nav"><a href="index.html">首页</a><a href="replace.html">术语替换</a><a href="identify.html">术语识别</a><a href="fix.html">SRT 修复</a><a href="batch_rename.html" class="active">批量重命名</a></nav>
  </header>
  <main class="hud-main">
    <h1 class="page-title">批量重命名</h1>
    <p class="page-sub">一键将多个文件夹重命名为统一命名规范</p>
    <section class="panel">
      <div class="panel-head"><span class="panel-dot"></span><h2>功能操作</h2></div>
      <p class="card-desc">上传多个文件夹（内含文件），为每个文件夹从下列命名模板中选择目标名称。</p>
      <div class="field">
        <label>上传文件夹（支持拖入多个独立文件夹，或选择一个父文件夹）</label>
        <div class="drop-zone" id="dropZoneRename">
          <input type="file" id="folderInput" webkitdirectory multiple />
          <div class="drop-hint">
            <span class="drop-icon">📁</span>
            <span>点击选择父文件夹，或直接拖入多个独立文件夹</span>
          </div>
        </div>
      </div>

      <div class="field" id="renameListWrap" hidden>
        <label>目标名称选择</label>
        <div id="renameList" class="rename-list"></div>
      </div>

      <div class="opts" id="langOpts" hidden>
        <div class="lang-block">
          <label class="lang-label">X 语言变量：</label>
          <div class="lang-chips" id="langChipsX">
            <label><input type="radio" name="langVarX" value="中" checked> 中</label>
            <label><input type="radio" name="langVarX" value="英"> 英</label>
            <label><input type="radio" name="langVarX" value="日"> 日</label>
            <label><input type="radio" name="langVarX" value="韩"> 韩</label>
            <label><input type="radio" name="langVarX" value="西"> 西</label>
            <label><input type="radio" name="langVarX" value="德"> 德</label>
            <label><input type="radio" name="langVarX" value="法"> 法</label>
            <label><input type="radio" name="langVarX" value="泰"> 泰</label>
          </div>
        </div>
        <div class="lang-block">
          <label class="lang-label">Y 语言变量（仅 YX 字幕使用）：</label>
          <div class="lang-chips" id="langChipsY">
            <label><input type="radio" name="langVarY" value="中" checked> 中</label>
            <label><input type="radio" name="langVarY" value="英"> 英</label>
            <label><input type="radio" name="langVarY" value="日"> 日</label>
            <label><input type="radio" name="langVarY" value="韩"> 韩</label>
            <label><input type="radio" name="langVarY" value="西"> 西</label>
            <label><input type="radio" name="langVarY" value="德"> 德</label>
            <label><input type="radio" name="langVarY" value="法"> 法</label>
            <label><input type="radio" name="langVarY" value="泰"> 泰</label>
          </div>
        </div>
      </div>

      <div class="opts" id="exportOpts" hidden>
        <label><input type="radio" name="exportMode" value="folder" checked> 直接保存到文件夹（需 Chrome/Edge）
        <label><input type="radio" name="exportMode" value="zip"> 下载 ZIP 压缩包</label>
      </div>

      <div class="actions" id="actionBar" hidden>
        <button type="button" id="btnPreview">预览变更</button>
        <button type="button" id="btnRename" class="btn-primary" hidden>执行重命名</button>
      </div>
      <div class="status" id="statusRename"></div>
    </section>
  </main>
  <script>
    // 名称模板：5 种
    // X 文旁白、X 语压制视频：使用 X 语言变量
    // YX 字幕：Y 和 X 分别为两个独立语言变量
    // template(x, y) 中 x 代表 X 变量，y 代表 Y 变量
    const NAME_TEMPLATES = [
      { id: 'clean', label: '净版视频', template: () => '净版视频' },
      { id: 'narration', label: 'X 文旁白', template: (x) => `${x}文旁白` },
      { id: 'original', label: '原剧', template: () => '原剧' },
      { id: 'subtitle', label: 'YX 字幕', template: (x, y) => `${y}${x}字幕` },
      { id: '压制', label: 'X 语压制视频', template: (x) => `${x}语压制视频` }
    ];

    const folderInput = document.getElementById('folderInput');
    const renameListWrap = document.getElementById('renameListWrap');
    const renameList = document.getElementById('renameList');
    const langOpts = document.getElementById('langOpts');
    const exportOpts = document.getElementById('exportOpts');
    const actionBar = document.getElementById('actionBar');
    const btnPreview = document.getElementById('btnPreview');
    const btnRename = document.getElementById('btnRename');
    const statusRename = document.getElementById('statusRename');
    const dropZoneRename = document.getElementById('dropZoneRename');

    let folders = []; // [{ name, files: [{ name, file }] }]
    let inputMode = 'picker'; // 'picker' | 'drop'

    // 拖入区域点击触发选择
    dropZoneRename.addEventListener('click', () => folderInput.click());

    // 拖拽事件
    ['dragover', 'dragenter'].forEach(evt => {
      dropZoneRename.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZoneRename.classList.add('drag-over');
      });
    });
    ['dragleave', 'drop'].forEach(evt => {
      dropZoneRename.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZoneRename.classList.remove('drag-over');
      });
    });

    // 递归读取拖入的目录
    function readDroppedDirEntry(entry, path = '') {
      return new Promise((resolve, reject) => {
        if (entry.isFile) {
          entry.file((file) => {
            resolve([{ name: path + file.name, file }]);
          }, reject);
        } else if (entry.isDirectory) {
          const reader = entry.createReader();
          const allFiles = [];
          const readAll = () => {
            reader.readEntries(async (entries) => {
              if (entries.length === 0) {
                resolve(allFiles);
                return;
              }
              const subPath = path + entry.name + '/';
              const promises = entries.map(e => readDroppedDirEntry(e, subPath));
              try {
                const results = await Promise.all(promises);
                for (const r of results) allFiles.push(...r);
                readAll();
              } catch (err) {
                reject(err);
              }
            }, reject);
          };
          readAll();
        } else {
          resolve([]);
        }
      });
    }

    dropZoneRename.addEventListener('drop', async (e) => {
      const items = e.dataTransfer?.items;
      if (!items) return;
      inputMode = 'drop';

      try {
        const dirResults = [];
        for (const item of items) {
          const entry = item.webkitGetAsEntry?.();
          if (!entry) continue;
          // 每个顶层 entry 视为一个独立文件夹
          const files = await readDroppedDirEntry(entry);
          dirResults.push({ name: entry.name, files });
        }

        folders = dirResults.filter(f => f.files.length > 0);
        if (folders.length === 0) {
          statusRename.className = 'status err';
          statusRename.textContent = '未在拖入内容中检测到文件夹';
          return;
        }
        showFolders();
      } catch (err) {
        statusRename.className = 'status err';
        statusRename.textContent = '读取拖入内容失败：' + err.message;
      }
    });

    // 从 webkitdirectory 输入中提取顶层文件夹
    // webkitRelativePath: "rootName/sub/file.mp4"
    // 如果用户选了一个父文件夹，内部含多个子文件夹（A, B, C），需要把 A/B/C 当独立文件夹
    function extractTopFolders(fileList) {
      const map = new Map(); // topName -> [{ name, file }]

      // 先检查是否只选了一个根目录
      const roots = new Set();
      for (const f of fileList) {
        const parts = f.webkitRelativePath.split('/');
        if (parts.length < 2) continue;
        roots.add(parts[0]);
      }

      // 如果只有一个根目录，需要看其直接子文件夹是独立文件夹还是文件
      if (roots.size === 1) {
        const rootName = Array.from(roots)[0];
        // 检查根目录下是否有子文件夹
        const subDirs = new Set();
        for (const f of fileList) {
          const parts = f.webkitRelativePath.split('/');
          if (parts.length < 3) continue; // 直接在根下的文件
          subDirs.add(parts[1]);
        }

        if (subDirs.size >= 2) {
          // 多个子文件夹：每个子文件夹作为一个独立文件夹
          for (const f of fileList) {
            const parts = f.webkitRelativePath.split('/');
            if (parts.length < 3) continue;
            const subName = parts[1];
            // 相对路径：去掉 rootName 和 subName
            const relName = parts.slice(2).join('/');
            if (!relName) continue;
            if (!map.has(subName)) map.set(subName, []);
            map.get(subName).push({ name: relName, file: f });
          }
        } else {
          // 单一根目录，没有多个子文件夹：把根目录作为一个文件夹
          for (const f of fileList) {
            const parts = f.webkitRelativePath.split('/');
            if (parts.length < 2) continue;
            const relName = parts.slice(1).join('/');
            if (!relName) continue;
            if (!map.has(rootName)) map.set(rootName, []);
            map.get(rootName).push({ name: relName, file: f });
          }
        }
      } else {
        // 多个根目录：每个根目录作为一个独立文件夹
        for (const f of fileList) {
          const parts = f.webkitRelativePath.split('/');
          if (parts.length < 2) continue;
          const rootName = parts[0];
          const relName = parts.slice(1).join('/');
          if (!relName) continue;
          if (!map.has(rootName)) map.set(rootName, []);
          map.get(rootName).push({ name: relName, file: f });
        }
      }

      return Array.from(map.entries()).map(([name, files]) => ({ name, files }));
    }

    folderInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      // webkitdirectory: webkitRelativePath 形如 "rootFolder/sub/file.mp4"
      // 提取 rootFolder 下一层的子文件夹作为独立文件夹
      // 如果只有一个根目录，则根目录本身就是一个文件夹
      inputMode = 'picker';
      folders = extractTopFolders(files);
      if (folders.length === 0) {
        statusRename.className = 'status err';
        statusRename.textContent = '未检测到文件夹';
        return;
      }
      showFolders();
    });

    function showFolders() {
      renderRenameList();
      renameListWrap.hidden = false;
      langOpts.hidden = false;
      exportOpts.hidden = false;
      actionBar.hidden = false;
      btnRename.hidden = true;
      statusRename.className = 'status';
      statusRename.textContent = `已识别 ${folders.length} 个文件夹，请为每个选择目标名称`;
    }

    function renderRenameList() {
      renameList.innerHTML = '';
      folders.forEach((f, idx) => {
        const row = document.createElement('div');
        row.className = 'rename-row';

        const src = document.createElement('div');
        src.className = 'rename-src';
        src.innerHTML = `<span class="rename-idx">${idx + 1}</span><span class="rename-name" title="${f.name}">${f.name}</span>`;

        const arrow = document.createElement('span');
        arrow.className = 'rename-arrow';
        arrow.textContent = '→';

        const select = document.createElement('select');
        select.className = 'rename-select';
        select.dataset.idx = idx;
        select.innerHTML = NAME_TEMPLATES.map(t =>
          `<option value="${t.id}">${t.label}</option>`
        ).join('');

        const preview = document.createElement('span');
        preview.className = 'rename-preview';
        preview.dataset.idx = idx;

        select.addEventListener('change', () => updatePreview(idx, select.value, preview));
        updatePreview(idx, select.value, preview);

        row.appendChild(src);
        row.appendChild(arrow);
        row.appendChild(select);
        row.appendChild(preview);
        renameList.appendChild(row);
      });
    }

    function getLangX() {
      const checked = document.querySelector('input[name="langVarX"]:checked');
      return checked ? checked.value : '中';
    }

    function getLangY() {
      const checked = document.querySelector('input[name="langVarY"]:checked');
      return checked ? checked.value : '中';
    }

    function updatePreview(idx, templateId, previewEl) {
      const x = getLangX();
      const y = getLangY();
      const tpl = NAME_TEMPLATES.find(t => t.id === templateId);
      if (!tpl) return;
      const newName = tpl.template(x, y);
      previewEl.textContent = newName;
      previewEl.dataset.newName = newName;
    }

    // 语言切换时刷新所有预览
    langOpts.addEventListener('change', () => {
      document.querySelectorAll('.rename-select').forEach(sel => {
        const idx = sel.dataset.idx;
        const preview = document.querySelector(`.rename-preview[data-idx="${idx}"]`);
        updatePreview(idx, sel.value, preview);
      });
    });

    btnPreview.addEventListener('click', () => {
      // 统计目标名称
      const mapping = [];
      const nameCount = new Map();
      folders.forEach((f, idx) => {
        const sel = document.querySelector(`.rename-select[data-idx="${idx}"]`);
        const preview = document.querySelector(`.rename-preview[data-idx="${idx}"]`);
        const newName = preview.dataset.newName;
        mapping.push({ old: f.name, new: newName });
        nameCount.set(newName, (nameCount.get(newName) || 0) + 1);
      });

      // 检查重名
      const duplicates = Array.from(nameCount.entries()).filter(([_, n]) => n > 1);
      if (duplicates.length > 0) {
        statusRename.className = 'status err';
        statusRename.textContent = `存在重名目标：${duplicates.map(([n, c]) => `"${n}" × ${c}`).join('、')}。请在浏览器导出时手动修改，或重新选择。`;
        return;
      }

      // 生成预览摘要
      statusRename.className = 'status ok';
      statusRename.textContent = `预览：将重命名 ${mapping.length} 个文件夹`;
      // 同时在状态栏下方渲染详细映射表
      renderPreviewTable(mapping);
      btnRename.hidden = false;
    });

    function renderPreviewTable(mapping) {
      let existing = document.getElementById('previewTable');
      if (existing) existing.remove();
      const table = document.createElement('div');
      table.id = 'previewTable';
      table.className = 'preview-table';
      table.innerHTML = mapping.map(m =>
        `<div class="preview-row"><span class="preview-old">${m.old}</span><span class="preview-arrow">→</span><span class="preview-new">${m.new}</span></div>`
      ).join('');
      actionBar.parentElement.appendChild(table);
    }

    // 执行重命名：支持直接保存到文件夹或下载 ZIP
    btnRename.addEventListener('click', async () => {
      statusRename.className = 'status';
      btnRename.disabled = true;

      try {
        // 收集映射：每个文件夹新名称 + 文件列表（含相对路径）
        const mapping = [];
        folders.forEach((f, idx) => {
          const preview = document.querySelector(`.rename-preview[data-idx="${idx}"]`);
          mapping.push({ old: f.name, new: preview.dataset.newName, files: f.files });
        });

        const exportMode = document.querySelector('input[name="exportMode"]:checked').value;

        if (exportMode === 'folder') {
          // 直接保存到文件夹
          if (!window.showDirectoryPicker) {
            throw new Error('当前浏览器不支持文件夹导出，请使用 Chrome/Edge，或选择 ZIP 导出');
          }
          statusRename.textContent = '请选择保存位置…';
          const dirHandle = await window.showDirectoryPicker();

          statusRename.textContent = '正在写入文件…';
          let fileCount = 0;
          for (const m of mapping) {
            for (const { name: relName, file } of m.files) {
              // 新路径：新文件夹名/原相对路径
              const fullPath = m.new + '/' + relName;
              const parts = fullPath.split('/');

              // 逐层创建子目录
              let current = dirHandle;
              for (let i = 0; i < parts.length - 1; i++) {
                current = await current.getDirectoryHandle(parts[i], { create: true });
              }
              const fileName = parts[parts.length - 1];
              const fileHandle = await current.getFileHandle(fileName, { create: true });
              const writable = await fileHandle.createWritable();
              const content = await file.arrayBuffer();
              await writable.write(content);
              await writable.close();
              fileCount++;
            }
          }
          statusRename.className = 'status ok';
          statusRename.textContent = `已完成，已保存 ${mapping.length} 个重命名后的文件夹（${fileCount} 个文件）`;
        } else {
          // 下载 ZIP
          statusRename.textContent = '正在打包…';
          const zip = new JSZip();
          for (const m of mapping) {
            for (const { name: relName, file } of m.files) {
              const fullPath = m.new + '/' + relName;
              const content = await file.arrayBuffer();
              zip.file(fullPath, content);
            }
          }
          const blob = await zip.generateAsync({ type: 'blob' });
          downloadBlob(blob, 'renamed_folders.zip');
          statusRename.className = 'status ok';
          statusRename.textContent = `已完成，已下载 ZIP：renamed_folders.zip（含 ${mapping.length} 个重命名后的文件夹）`;
        }
      } catch (e) {
        if (e.name === 'AbortError') {
          statusRename.className = 'status';
          statusRename.textContent = '已取消';
        } else {
          statusRename.className = 'status err';
          statusRename.textContent = '失败：' + e.message;
        }
      } finally {
        btnRename.disabled = false;
      }
    });

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</body>
</html>
