<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SRT 批量修复 · 字幕工具箱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css?v=8" />
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>
  <header class="hud-top">
    <a href="index.html" class="brand"><span class="brand-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="4" width="12" height="1.5" rx=".5" fill="#fafffd"/><rect x="2" y="7.25" width="9" height="1.5" rx=".5" fill="#fafffd" opacity=".9"/><rect x="2" y="10.5" width="11" height="1.5" rx=".5" fill="#fafffd" opacity=".75"/></svg>
      </span>字幕工具箱</a>
    <nav class="hud-nav"><a href="index.html">首页</a><a href="replace.html">术语替换</a><a href="fix.html" class="active">SRT 修复</a><a href="align.html">跨语言对齐</a><a href="flatten.html">目录平铺</a></nav>
  </header>
  <main class="hud-main">
    <h1 class="page-title">SRT 批量修复</h1>
    <p class="page-sub">统一换行与时间轴，便于导入剪映</p>
    <section class="panel">
      <div class="panel-head"><span class="panel-dot"></span><h2>功能操作</h2></div>
      <p class="card-desc">直接拖入文件夹，任意层级子文件夹中的 .srt 都会被识别。</p>
      <div class="field">
        <label>字幕（直接拖入文件夹）</label>
        <div class="drop-zone" id="dropZoneFix">
          <input type="file" id="subsFixFolder" webkitdirectory multiple hidden />
          <div class="drop-hint">
            <span class="drop-icon">📁</span>
            <span>点击选择文件夹，或直接拖入文件夹</span>
          </div>
        </div>
      </div>
      <div class="opts">
        <label>输出文件夹名称：
          <input type="text" id="folderName" class="folder-name-input" placeholder="fixed" />
        </label>
      </div>
      <div class="actions"><button type="button" id="btnFix">批量修复</button><button type="button" id="btnScanDigits" class="btn-ghost">扫描阿拉伯数字</button></div>
      <div class="status" id="statusFix"></div>
    </section>

    <section class="panel" id="digitPanel" hidden>
      <div class="panel-head"><span class="panel-dot"></span><h2>阿拉伯数字识别结果</h2></div>
      <p class="panel-sub">仅识别字幕正文中的阿拉伯数字位置（不含时间轴与序号）。只读展示，不修改原文件。</p>
      <div class="status" id="statusDigit"></div>
      <div id="digitResult" class="scan-result" hidden></div>
    </section>
  </main>
  <script src="srt.js?v=8"></script>
  <script>
    const btnFix = document.getElementById('btnFix');
    const statusFix = document.getElementById('statusFix');
    const subsFixFolder = document.getElementById('subsFixFolder');
    const dropZoneFix = document.getElementById('dropZoneFix');

    let sourceType = null; // 'folder' | 'drop'
    let droppedSrtFiles = [];

    dropZoneFix.addEventListener('click', () => {
      subsFixFolder.click();
    });

    subsFixFolder.addEventListener('change', (e) => {
      if (e.target.files.length > 0) sourceType = 'folder';
    });

    ['dragover', 'dragenter'].forEach(evt => {
      dropZoneFix.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZoneFix.classList.add('drag-over');
      });
    });
    ['dragleave', 'drop'].forEach(evt => {
      dropZoneFix.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZoneFix.classList.remove('drag-over');
      });
    });
    dropZoneFix.addEventListener('drop', async (e) => {
      sourceType = 'drop';
      try {
        droppedSrtFiles = await extractSrtFromDropEvent(e);
        if (droppedSrtFiles.length === 0) {
          alert('拖入的内容中未找到 SRT 文件');
          sourceType = null;
          droppedSrtFiles = [];
        } else {
          statusFix.className = 'status ok';
          statusFix.textContent = `已识别 ${droppedSrtFiles.length} 个 SRT 文件，点击"批量修复"开始`;
        }
      } catch (err) {
        alert('读取拖入内容失败：' + err.message);
        sourceType = null;
        droppedSrtFiles = [];
      }
    });

    async function loadFixSubtitleFiles() {
      const results = [];

      if (sourceType === 'folder') {
        const items = extractSrtFromFileList(subsFixFolder.files);
        for (const item of items) {
          const content = await item.file.text();
          results.push({ name: item.name, content, size: item.file.size });
        }
      } else if (sourceType === 'drop') {
        for (const item of droppedSrtFiles) {
          const content = await item.file.text();
          results.push({ name: item.name, content, size: item.file.size });
        }
      } else {
        throw new Error('请选择或拖入字幕文件');
      }

      // 按文件名数字大小自然排序（ep1, ep2, ..., ep10）
      results.sort((a, b) => naturalCompare(a.name, b.name));

      if (results.length === 0) {
        throw new Error('未找到 SRT 文件');
      }
      return results;
    }

    btnFix.onclick = async () => {
      if (!sourceType) return alert('请上传或拖入字幕（ZIP / 文件夹）');
      
      statusFix.className = 'status';
      statusFix.textContent = '处理中…';
      btnFix.disabled = true;
      
      try {
        const subtitleFiles = await loadFixSubtitleFiles();
        let processedCount = 0;
        const reports = [];
        const outputFiles = [];
        const rawFolderName = document.getElementById('folderName').value.trim();
        const folderName = (rawFolderName || 'fixed').replace(/[\\/:*?"<>|]/g, '_');

        for (const subFile of subtitleFiles) {
          const subs = parseSrt(subFile.content);

          // 规范化
          for (const line of subs) {
            if (line.text) {
              line.text = line.text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
              const parts = line.text.split('\n').map(p => p.trim()).filter(p => p);
              line.text = parts.join('\n');
            }
            if (line.end <= line.start) {
              line.end = line.start + 2000;
            }
          }

          // 检查文件大小与是否包含中文
          const hasChinese = /[\u4e00-\u9fff]/.test(subFile.content);
          const report = { fileName: subFile.name, size: subFile.size, hasChinese };
          reports.push(report);

          const outContent = generateSrt(subs);
          const outName = subFile.name.split('/').pop();
          outputFiles.push({ path: folderName + '/' + outName, content: outContent });
          processedCount++;
        }

        const smallFiles = reports.filter(r => r.size <= 1024);
        const smallFileNames = smallFiles.map(r => r.fileName.split('/').pop()).join('、');
        const smallFileHint = smallFiles.length > 0
          ? `，其中 ${smallFiles.length} 个为小文件（≤1KB）：${smallFileNames}`
          : '';

        const chineseFiles = reports.filter(r => r.hasChinese);
        const chineseFileNames = chineseFiles.map(r => r.fileName.split('/').pop()).join('、');
        const chineseHint = chineseFiles.length > 0
          ? `，其中 ${chineseFiles.length} 个文件包含中文：${chineseFileNames}`
          : '';

        if (!window.showDirectoryPicker) {
          throw new Error('当前浏览器不支持文件夹导出，请使用 Chrome/Edge');
        }
        const result = await saveFilesToFolder(outputFiles);
        if (!result.success) throw new Error(result.message);
        statusFix.className = 'status ok';
        statusFix.textContent = `${result.message}（位于 ${folderName}/ 文件夹内）${smallFileHint}${chineseHint}`;
      } catch (e) {
        statusFix.className = 'status err';
        statusFix.textContent = e.message;
      } finally {
        btnFix.disabled = false;
      }
    };

    // ------- 阿拉伯数字识别（只读定位） -------
    const btnScanDigits = document.getElementById('btnScanDigits');
    const digitPanel   = document.getElementById('digitPanel');
    const digitResult  = document.getElementById('digitResult');
    const statusDigit = document.getElementById('statusDigit');

    btnScanDigits.addEventListener('click', async () => {
      if (!sourceType) {
        alert('请先上传或拖入字幕（ZIP / 文件夹）');
        return;
      }
      btnScanDigits.disabled = true;
      statusDigit.className = 'status';
      statusDigit.textContent = '扫描中…';
      digitPanel.hidden = false;
      digitResult.hidden = true;

      try {
        const files = await loadFixSubtitleFiles();
        const allHits = [];
        const fileHitCount = {};

        for (const f of files) {
          const subs = parseSrt(f.content);
          for (let i = 0; i < subs.length; i++) {
            const line = subs[i];
            if (!line.text) continue;
            // 字幕正文可能多行，扁平化便于高亮展示
            const flat = line.text.replace(/\r\n/g, '\n').replace(/\n/g, ' ');
            const re = /\d+/g;
            let m;
            while ((m = re.exec(flat)) !== null) {
              allHits.push({
                fileName: f.name,
                subIdx: i + 1,
                start: line.start,
                end: line.end,
                text: flat,
                digit: m[0],
                digitStart: m.index,
              });
              fileHitCount[f.name] = (fileHitCount[f.name] || 0) + 1;
            }
          }
        }

        renderDigitResult(allHits, fileHitCount);
        statusDigit.className = 'status ok';
        statusDigit.textContent = `扫描完成：共 ${allHits.length} 处阿拉伯数字命中，涉及 ${Object.keys(fileHitCount).length} 个文件`;
      } catch (e) {
        statusDigit.className = 'status err';
        statusDigit.textContent = '扫描失败：' + e.message;
      } finally {
        btnScanDigits.disabled = false;
      }
    });

    function renderDigitResult(hits, fileHitCount) {
      digitResult.hidden = false;
      digitResult.innerHTML = '';

      // 文件分布摘要
      const summary = document.createElement('div');
      summary.className = 'scan-summary';
      const dist = Object.entries(fileHitCount)
        .sort((a, b) => b[1] - a[1])
        .map(([k, v]) => `${k.split('/').pop()} (${v})`)
        .join('  ');
      summary.textContent = `命中分布：` + dist;
      digitResult.appendChild(summary);

      // 命中表
      const table = document.createElement('table');
      table.className = 'hit-table';
      table.innerHTML = `
        <thead><tr>
          <th style="width:2.5rem">#</th>
          <th>文件</th>
          <th style="width:3rem">字幕#</th>
          <th style="width:9rem">时间轴</th>
          <th>数字</th>
          <th>上下文</th>
        </tr></thead>
        <tbody></tbody>`;
      const tbody = table.querySelector('tbody');

      const limit = 500;
      const showCount = Math.min(hits.length, limit);
      for (let i = 0; i < showCount; i++) {
        const h = hits[i];
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${i + 1}</td>
          <td class="hit-fname" title="${escapeHtmlAttr(h.fileName)}">${escapeHtml(h.fileName.split('/').pop())}</td>
          <td>${h.subIdx}</td>
          <td>${formatTimecode(h.start)} → ${formatTimecode(h.end)}</td>
          <td class="digit-value">${escapeHtml(h.digit)}</td>
          <td class="hit-ctx">${highlightDigit(h.text, h.digitStart, h.digit.length)}</td>`;
        tbody.appendChild(tr);
      }
      if (hits.length > limit) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="6" class="hit-more">…省略 ${hits.length - limit} 条</td>`;
        tbody.appendChild(tr);
      }
      digitResult.appendChild(table);
    }

    function highlightDigit(text, start, len) {
      const safe = escapeHtml(text);
      // 重建索引：escapeHtml 不改变 ASCII 字符位置（\d < 128 安全）
      return safe.slice(0, start)
        + `<mark>${safe.slice(start, start + len)}</mark>`
        + safe.slice(start + len);
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function escapeHtmlAttr(s) {
      return escapeHtml(s).replace(/"/g, '&quot;');
    }
    function formatTimecode(ms) {
      if (ms == null) return '--';
      const total = Math.max(0, Math.floor(ms));
      const h = Math.floor(total / 3600000);
      const m = Math.floor((total % 3600000) / 60000);
      const s = Math.floor((total % 60000) / 1000);
      const milli = total % 1000;
      const pad = (n, l = 2) => String(n).padStart(l, '0');
      return `${pad(h)}:${pad(m)}:${pad(s)},${pad(3).slice(0, 3)}`;
    }
  </script>
</body>
</html>
