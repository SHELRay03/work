<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SRT 批量修复 · 字幕工具箱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css?v=12" />
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>
  <header class="hud-top">
    <a href="index.html" class="brand"><span class="brand-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="4" width="12" height="1.5" rx=".5" fill="#fafffd"/><rect x="2" y="7.25" width="9" height="1.5" rx=".5" fill="#fafffd" opacity=".9"/><rect x="2" y="10.5" width="11" height="1.5" rx=".5" fill="#fafffd" opacity=".75"/></svg>
      </span>字幕工具箱</a>
    <nav class="hud-nav"><a href="index.html">首页</a><a href="reorganize.html">语种重组</a><a href="preprocess.html">预处理</a><a href="replace.html">术语替换</a><a href="fix.html" class="active">SRT 修复</a><a href="align.html">跨语言对齐</a><a href="flatten.html">目录平铺</a></nav>
  </header>
  <main class="hud-main">
    <h1 class="page-title">SRT 批量修复</h1>
    <p class="page-sub">统一换行与时间轴，便于导入剪映</p>
    <section class="panel">
      <div class="panel-head"><span class="panel-dot"></span><h2>功能操作</h2></div>
      <p class="card-desc">直接拖入文件夹，任意层级子文件夹中的 .srt 都会被识别。</p>
      <div class="field">
        <label>字幕（直接拖入文件夹）</label>
        <div class="drop-zone" id="dropZoneFix">
          <input type="file" id="subsFixFolder" webkitdirectory multiple hidden />
          <div class="drop-hint">
            <span class="drop-icon">📁</span>
            <span>点击选择文件夹，或直接拖入文件夹</span>
          </div>
        </div>
      </div>
      <div class="field">
        <label>模板字幕 B（可选，用于时间轴对比）</label>
        <div class="drop-zone" id="dropZoneTpl">
          <input type="file" id="subsTplFolder" webkitdirectory multiple hidden />
          <div class="drop-hint">
            <span class="drop-icon">📂</span>
            <span>点击选择文件夹，或直接拖入文件夹</span>
          </div>
        </div>
      </div>
      <div class="opts">
        <label>输出文件夹名称：
          <input type="text" id="folderName" class="folder-name-input" placeholder="fixed" />
        </label>
      </div>
      <div class="actions"><button type="button" id="btnFix">批量修复</button><button type="button" id="btnHealth" class="btn-ghost">健康检查</button></div>
      <div class="status" id="statusFix"></div>
    </section>

    <section class="panel" id="healthPanel" hidden>
      <div class="panel-head"><span class="panel-dot"></span><h2>字幕健康检查</h2></div>
      <p class="panel-sub">扫描 6 类内部异常：阿拉伯数字、超长时间轴、时间轴倒退、时间轴重叠、空文本、重复块。若已上传模板字幕 B，额外对比 A↔B 时间轴覆盖：A 中缺失（B 有 A 无）、A 中多余（A 有 B 无）。只读，不修改原文件。</p>
      <div class="status" id="statusHealth"></div>
      <div id="healthChips" class="health-chips" hidden></div>
      <div id="healthResult" class="scan-result" hidden></div>
    </section>
  </main>
  <script src="srt.js?v=10"></script>
  <script>
    const btnFix = document.getElementById('btnFix');
    const statusFix = document.getElementById('statusFix');
    const subsFixFolder = document.getElementById('subsFixFolder');
    const dropZoneFix = document.getElementById('dropZoneFix');

    let sourceType = null; // 'folder' | 'drop'
    let droppedSrtFiles = [];

    // ------- 模板字幕 B（可选，用于时间轴对比） -------
    const dropZoneTpl   = document.getElementById('dropZoneTpl');
    const subsTplFolder = document.getElementById('subsTplFolder');
    const tplHintText   = dropZoneTpl.querySelector('.drop-hint span:last-child');
    let templateType = null; // 'folder' | 'drop' | null
    let droppedTplFiles = [];
    const TPL_DEFAULT_HINT = '点击选择文件夹，或直接拖入文件夹';

    dropZoneTpl.addEventListener('click', () => subsTplFolder.click());

    subsTplFolder.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        templateType = 'folder';
        tplHintText.textContent = `已选择模板文件夹（${e.target.files.length} 项），点击重选`;
      }
    });

    ['dragover', 'dragenter'].forEach(evt => {
      dropZoneTpl.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZoneTpl.classList.add('drag-over');
      });
    });
    ['dragleave', 'drop'].forEach(evt => {
      dropZoneTpl.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZoneTpl.classList.remove('drag-over');
      });
    });
    dropZoneTpl.addEventListener('drop', async (e) => {
      templateType = 'drop';
      try {
        droppedTplFiles = await extractSrtFromDropEvent(e);
        if (droppedTplFiles.length === 0) {
          alert('拖入的内容中未找到 SRT 文件');
          templateType = null;
          droppedTplFiles = [];
          tplHintText.textContent = TPL_DEFAULT_HINT;
        } else {
          tplHintText.textContent = `已识别 ${droppedTplFiles.length} 个 SRT 模板（B），点击重选`;
        }
      } catch (err) {
        alert('读取拖入内容失败：' + err.message);
        templateType = null;
        droppedTplFiles = [];
        tplHintText.textContent = TPL_DEFAULT_HINT;
      }
    });

    dropZoneFix.addEventListener('click', () => {
      subsFixFolder.click();
    });

    subsFixFolder.addEventListener('change', (e) => {
      if (e.target.files.length > 0) sourceType = 'folder';
    });

    ['dragover', 'dragenter'].forEach(evt => {
      dropZoneFix.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZoneFix.classList.add('drag-over');
      });
    });
    ['dragleave', 'drop'].forEach(evt => {
      dropZoneFix.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZoneFix.classList.remove('drag-over');
      });
    });
    dropZoneFix.addEventListener('drop', async (e) => {
      sourceType = 'drop';
      try {
        droppedSrtFiles = await extractSrtFromDropEvent(e);
        if (droppedSrtFiles.length === 0) {
          alert('拖入的内容中未找到 SRT 文件');
          sourceType = null;
          droppedSrtFiles = [];
        } else {
          statusFix.className = 'status ok';
          statusFix.textContent = `已识别 ${droppedSrtFiles.length} 个 SRT 文件，点击"批量修复"开始`;
        }
      } catch (err) {
        alert('读取拖入内容失败：' + err.message);
        sourceType = null;
        droppedSrtFiles = [];
      }
    });

    async function loadFixSubtitleFiles() {
      const results = [];

      if (sourceType === 'folder') {
        const items = extractSrtFromFileList(subsFixFolder.files);
        for (const item of items) {
          const content = await item.file.text();
          results.push({ name: item.name, content, size: item.file.size });
        }
      } else if (sourceType === 'drop') {
        for (const item of droppedSrtFiles) {
          const content = await item.file.text();
          results.push({ name: item.name, content, size: item.file.size });
        }
      } else {
        throw new Error('请选择或拖入字幕文件');
      }

      // 按文件名数字大小自然排序（ep1, ep2, ..., ep10）
      results.sort((a, b) => naturalCompare(a.name, b.name));

      if (results.length === 0) {
        throw new Error('未找到 SRT 文件');
      }
      return results;
    }

    // 加载模板字幕 B（仿照 loadFixSubtitleFiles）
    async function loadTplSubtitleFiles() {
      const results = [];
      if (templateType === 'folder') {
        const items = extractSrtFromFileList(subsTplFolder.files);
        for (const item of items) {
          const content = await item.file.text();
          results.push({ name: item.name, content, size: item.file.size });
        }
      } else if (templateType === 'drop') {
        for (const item of droppedTplFiles) {
          const content = await item.file.text();
          results.push({ name: item.name, content, size: item.file.size });
        }
      }
      results.sort((a, b) => naturalCompare(a.name, b.name));
      if (results.length === 0) {
        throw new Error('模板字幕 B 中未找到 SRT 文件');
      }
      return results;
    }

    btnFix.onclick = async () => {
      if (!sourceType) return alert('请上传或拖入字幕（ZIP / 文件夹）');
      
      statusFix.className = 'status';
      statusFix.textContent = '处理中…';
      btnFix.disabled = true;
      
      try {
        const subtitleFiles = await loadFixSubtitleFiles();
        let processedCount = 0;
        const reports = [];
        const outputFiles = [];
        const rawFolderName = document.getElementById('folderName').value.trim();
        const folderName = (rawFolderName || 'fixed').replace(/[\\/:*?"<>|]/g, '_');

        for (const subFile of subtitleFiles) {
          const subs = parseSrt(subFile.content);

          // 规范化
          for (const line of subs) {
            if (line.text) {
              line.text = line.text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
              const parts = line.text.split('\n').map(p => p.trim()).filter(p => p);
              line.text = parts.join('\n');
            }
            if (line.end <= line.start) {
              line.end = line.start + 2000;
            }
          }

          // 检查文件大小、内容行数与是否包含中文
          const hasChinese = /[\u4e00-\u9fff]/.test(subFile.content);
          const nonEmptyLines = String(subFile.content)
            .split(/\r\n|\r|\n/)
            .map(l => l.trim())
            .filter(l => l.length > 0).length;
          let smallReason = null;
          if (subFile.size <= 1024) {
            if (nonEmptyLines === 0) smallReason = '空白';
            else if (nonEmptyLines === 1) smallReason = '仅一行';
          }
          const report = { fileName: subFile.name, size: subFile.size, hasChinese, smallReason };
          reports.push(report);

          const outContent = generateSrt(subs);
          const outName = subFile.name.split('/').pop();
          outputFiles.push({ path: folderName + '/' + outName, content: outContent });
          processedCount++;
        }

        const smallFiles = reports.filter(r => r.smallReason !== null);
        const smallFileNames = smallFiles
          .map(r => `${r.fileName.split('/').pop()}（${r.smallReason}）`)
          .join('、');
        const smallFileHint = smallFiles.length > 0
          ? `，其中 ${smallFiles.length} 个为异常小文件（≤1KB 且空白/仅一行）：${smallFileNames}`
          : '';

        const chineseFiles = reports.filter(r => r.hasChinese);
        const chineseFileNames = chineseFiles.map(r => r.fileName.split('/').pop()).join('、');
        const chineseHint = chineseFiles.length > 0
          ? `，其中 ${chineseFiles.length} 个文件包含中文：${chineseFileNames}`
          : '';

        if (!window.showDirectoryPicker) {
          throw new Error('当前浏览器不支持文件夹导出，请使用 Chrome/Edge');
        }
        const result = await saveFilesToFolder(outputFiles);
        if (!result.success) throw new Error(result.message);
        statusFix.className = 'status ok';
        statusFix.textContent = `${result.message}（位于 ${folderName}/ 文件夹内）${smallFileHint}${chineseHint}`;
      } catch (e) {
        statusFix.className = 'status err';
        statusFix.textContent = e.message;
      } finally {
        btnFix.disabled = false;
      }
    };

    // ------- 字幕健康检查（一次性 6 类扫描，复用 parseSrt 结果） -------
    const btnHealth      = document.getElementById('btnHealth');
    const healthPanel    = document.getElementById('healthPanel');
    const healthChips    = document.getElementById('healthChips');
    const healthResult   = document.getElementById('healthResult');
    const statusHealth   = document.getElementById('statusHealth');
    const CONTAIN_MIN_GAP_MS = 100;
    const TIMELINE_TOLERANCE_MS = 50; // A↔B 时间轴对比容差
    const HEALTH_CATEGORIES = [
      { key: 'digit',    label: '阿拉伯数字',  tone: 'warn' },
      { key: 'longaxis', label: '超长时间轴',  tone: 'danger' },
      { key: 'reverse',  label: '时间轴倒退',  tone: 'danger' },
      { key: 'overlap',  label: '时间轴重叠',  tone: 'warn' },
      { key: 'empty',    label: '空文本',     tone: 'danger' },
      { key: 'dup',      label: '重复块',     tone: 'warn' },
      { key: 'missing',  label: 'A 时间轴缺失', tone: 'danger' },
      { key: 'extra',    label: 'A 时间轴多余', tone: 'warn' },
    ];

    btnHealth.addEventListener('click', async () => {
      if (!sourceType) { alert('请先上传或拖入字幕（ZIP / 文件夹）'); return; }
      btnHealth.disabled = true;
      statusHealth.className = 'status';
      statusHealth.textContent = '扫描中…';
      healthPanel.hidden = false;
      healthChips.hidden = true;
      healthResult.hidden = true;
      try {
        const files = await loadFixSubtitleFiles();
        const parsed = [];
        for (const f of files) parsed.push({ name: f.name, subs: parseSrt(f.content) });

        // 模板字幕 B（可选，用于 A↔B 时间轴对比）
        let parsedB = null;
        if (templateType) {
          const bFiles = await loadTplSubtitleFiles();
          parsedB = [];
          for (const f of bFiles) parsedB.push({ name: f.name, subs: parseSrt(f.content) });
        }

        const results = runHealthChecks(parsed, parsedB);
        const hasB = !!parsedB;
        renderHealthResult(results, hasB);
        const totalHits = Object.values(results).reduce((s, r) => s + r.hits.length, 0);
        const filesWithHits = new Set();
        for (const r of Object.values(results)) for (const fn of Object.keys(r.fileCount)) filesWithHits.add(fn);
        const compareHint = hasB ? '，含 A↔B 时间轴对比' : '';
        statusHealth.className = 'status ok';
        statusHealth.textContent = `扫描完成：共 ${totalHits} 处异常，涉及 ${filesWithHits.size} 个文件（共 ${parsed.length} 个文件${compareHint}）`;
      } catch (e) {
        statusHealth.className = 'status err';
        statusHealth.textContent = '扫描失败：' + e.message;
      } finally {
        btnHealth.disabled = false;
      }
    });

    function runHealthChecks(parsed, parsedB) {
      const results = {};
      for (const c of HEALTH_CATEGORIES) results[c.key] = { hits: [], fileCount: {} };
      for (const p of parsed) {
        const { name, subs } = p;
        const bump = (key) => { results[key].fileCount[name] = (results[key].fileCount[name] || 0) + 1; };

        // 1. 阿拉伯数字
        for (let i = 0; i < subs.length; i++) {
          const line = subs[i];
          if (!line.text) continue;
          const flat = line.text.replace(/\r\n/g, '\n').replace(/\n/g, ' ');
          const re = /\d+/g;
          let m;
          while ((m = re.exec(flat)) !== null) {
            results.digit.hits.push({
              fileName: name, subIdx: i + 1,
              start: line.start, end: line.end,
              text: flat, digit: m[0], digitStart: m.index,
            });
            bump('digit');
          }
        }

        // 2. 超长时间轴（A 包含 B，且 A-B >= 100ms）
        for (let i = 0; i < subs.length; i++) {
          const a = subs[i];
          const durA = a.end - a.start;
          const contained = [];
          for (let j = 0; j < subs.length; j++) {
            if (j === i) continue;
            const b = subs[j];
            const durB = b.end - b.start;
            if (b.start >= a.start && b.end <= a.end && durA - durB >= CONTAIN_MIN_GAP_MS) {
              contained.push({ subIdx: j + 1, start: b.start, end: b.end, text: flattenText(b.text) });
            }
          }
          if (contained.length > 0) {
            results.longaxis.hits.push({
              fileName: name, subIdx: i + 1, start: a.start, end: a.end,
              duration: durA, text: flattenText(a.text), contained,
            });
            bump('longaxis');
          }
        }

        // 3. 时间轴倒退（end <= start）
        for (let i = 0; i < subs.length; i++) {
          const s = subs[i];
          if (s.end <= s.start) {
            results.reverse.hits.push({
              fileName: name, subIdx: i + 1, start: s.start, end: s.end,
              duration: s.end - s.start, text: flattenText(s.text),
            });
            bump('reverse');
          }
        }

        // 4. 时间轴重叠（相邻 i 与 i+1，且不是完整包含）
        for (let i = 0; i < subs.length - 1; i++) {
          const a = subs[i], b = subs[i + 1];
          if (b.start < a.end) {
            const isContained = b.start >= a.start && b.end <= a.end && (a.end - a.start) - (b.end - b.start) >= CONTAIN_MIN_GAP_MS;
            if (!isContained) {
              results.overlap.hits.push({
                fileName: name, subIdxA: i + 1, subIdxB: i + 2,
                startA: a.start, endA: a.end, startB: b.start, endB: b.end,
                overlapMs: a.end - b.start,
                textA: flattenText(a.text), textB: flattenText(b.text),
              });
              bump('overlap');
            }
          }
        }

        // 5. 空文本
        for (let i = 0; i < subs.length; i++) {
          const s = subs[i];
          const text = String(s.text || '');
          const hasNonEmpty = text.split(/\r\n|\r|\n/).some(l => l.trim().length > 0);
          if (!hasNonEmpty) {
            results.empty.hits.push({ fileName: name, subIdx: i + 1, start: s.start, end: s.end });
            bump('empty');
          }
        }

        // 6. 重复块（相同 start+end+text 出现 >= 2 次）
        const seen = new Map();
        for (let i = 0; i < subs.length; i++) {
          const s = subs[i];
          const key = `${s.start}|${s.end}|${String(s.text || '').trim()}`;
          if (!seen.has(key)) seen.set(key, []);
          seen.get(key).push(i + 1);
        }
        for (const [key, idxs] of seen) {
          if (idxs.length >= 2) {
            const parts = key.split('|');
            const st = parts[0], ed = parts[1];
            const txt = parts.slice(2).join('|');
            results.dup.hits.push({
              fileName: name, start: Number(st), end: Number(ed),
              text: txt, subIdxs: idxs, count: idxs.length,
            });
            bump('dup');
          }
        }
      }
      // A↔B 时间轴对比（仅在传入模板 B 时执行）
      if (parsedB) runTimelineCompare(parsed, parsedB, results);
      return results;
    }

    // ------- A↔B 时间轴对比 -------
    // 规则：
    //   - 按文件名配对（取 basename，忽略路径差异）
    //   - 容差 TIMELINE_TOLERANCE_MS（50ms）
    //   - B 中某条 b：若 A 中存在 a 满足 a.start ≤ b.start+容差 且 a.end ≥ b.end-容差 → 已覆盖（含合并）
    //     否则 → missing（A 缺失）
    //   - A 中某条 a：若 B 中存在 b 一对一匹配（容差内 start/end 相等）→ 正常
    //     否则若 a 覆盖了 B 中至少 1 条字幕（a.start ≤ b.start+容差 且 a.end ≥ b.end-容差）→ 合并，正常
    //     否则 → extra（A 多余）
    function runTimelineCompare(parsedA, parsedB, results) {
      const TOL = TIMELINE_TOLERANCE_MS;
      // B 按文件名建立索引（basename）
      const bMap = new Map();
      for (const p of parsedB) bMap.set(basenameOf(p.name), p);

      const bumpMissing = (fn) => { results.missing.fileCount[fn] = (results.missing.fileCount[fn] || 0) + 1; };
      const bumpExtra   = (fn) => { results.extra.fileCount[fn]   = (results.extra.fileCount[fn]   || 0) + 1; };

      for (const pa of parsedA) {
        const aName = pa.name;
        const aBase = basenameOf(aName);
        const pb = bMap.get(aBase);
        if (!pb) {
          // A 中存在但 B 中无对应文件 → A 整文件多余，逐条记为 extra
          for (let i = 0; i < pa.subs.length; i++) {
            const a = pa.subs[i];
            results.extra.hits.push({
              fileName: aName, subIdx: i + 1, start: a.start, end: a.end,
              text: flattenText(a.text), reason: 'B 中无对应文件',
            });
            bumpExtra(aName);
          }
          continue;
        }
        const aSubs = pa.subs, bSubs = pb.subs;

        // B 中无对应 A 的文件已在下面处理（遍历 B 时记录 missing）
        // 1. 检查 B 中每条是否被 A 覆盖（含合并）→ 未覆盖即 missing
        for (let j = 0; j < bSubs.length; j++) {
          const b = bSubs[j];
          const covered = aSubs.some(a => a.start <= b.start + TOL && a.end >= b.end - TOL);
          if (!covered) {
            results.missing.hits.push({
              fileName: aName, bSubIdx: j + 1, bFileName: pb.name,
              start: b.start, end: b.end, text: flattenText(b.text),
            });
            bumpMissing(aName);
          }
        }

        // 2. 检查 A 中每条是否在 B 中有对应（一对一 或 合并）→ 否则 extra
        for (let i = 0; i < aSubs.length; i++) {
          const a = aSubs[i];
          const oneToOne = bSubs.some(b => Math.abs(a.start - b.start) <= TOL && Math.abs(a.end - b.end) <= TOL);
          const isMerge = !oneToOne && bSubs.some(b => a.start <= b.start + TOL && a.end >= b.end - TOL);
          if (!oneToOne && !isMerge) {
            results.extra.hits.push({
              fileName: aName, subIdx: i + 1, start: a.start, end: a.end,
              text: flattenText(a.text), reason: 'B 中无对应时间轴',
            });
            bumpExtra(aName);
          }
        }
      }

      // B 中有、A 中无对应文件 → 整文件 missing
      const aBaseSet = new Set(parsedA.map(p => basenameOf(p.name)));
      for (const pb of parsedB) {
        const bBase = basenameOf(pb.name);
        if (aBaseSet.has(bBase)) continue;
        for (let j = 0; j < pb.subs.length; j++) {
          const b = pb.subs[j];
          results.missing.hits.push({
            fileName: pb.name, bSubIdx: j + 1, bFileName: pb.name,
            start: b.start, end: b.end, text: flattenText(b.text),
            reason: 'A 中无对应文件',
          });
          bumpMissing(pb.name);
        }
      }
    }

    function basenameOf(name) {
      return String(name).split('/').pop();
    }

    function renderHealthResult(results, hasB) {
      healthChips.hidden = false;
      healthResult.hidden = false;
      healthChips.innerHTML = '';
      healthResult.innerHTML = '';

      const isCompareOnly = (key) => key === 'missing' || key === 'extra';
      const skipKey = (key) => !hasB && isCompareOnly(key);

      for (const c of HEALTH_CATEGORIES) {
        if (skipKey(c.key)) continue;
        const r = results[c.key];
        const count = r.hits.length;
        const files = Object.keys(r.fileCount).length;
        const chip = document.createElement('span');
        chip.className = `health-chip ${c.tone} ${count > 0 ? 'has-hit' : 'pass'}`;
        chip.textContent = `${count > 0 ? '✗' : '✓'} ${c.label}：${count}（${files} 文件）`;
        healthChips.appendChild(chip);
      }

      for (const c of HEALTH_CATEGORIES) {
        if (skipKey(c.key)) continue;
        const r = results[c.key];
        const card = document.createElement('details');
        card.className = `health-card ${c.tone}`;
        card.open = r.hits.length > 0;
        const summary = document.createElement('summary');
        summary.innerHTML = `<span class="card-title">${c.label}</span><span class="card-count">${r.hits.length} 处 · ${Object.keys(r.fileCount).length} 文件</span>`;
        card.appendChild(summary);

        const body = document.createElement('div');
        body.className = 'card-body';
        if (r.hits.length === 0) {
          body.innerHTML = '<div class="empty-pass">✓ 无异常</div>';
        } else if (c.key === 'digit')    renderDigit(body, r.hits, r.fileCount);
        else if (c.key === 'longaxis') renderLongaxis(body, r.hits, r.fileCount);
        else if (c.key === 'reverse')  renderReverse(body, r.hits, r.fileCount);
        else if (c.key === 'overlap')  renderOverlap(body, r.hits, r.fileCount);
        else if (c.key === 'empty')    renderEmpty(body, r.hits, r.fileCount);
        else if (c.key === 'dup')      renderDup(body, r.hits, r.fileCount);
        else if (c.key === 'missing')  renderMissing(body, r.hits, r.fileCount);
        else if (c.key === 'extra')    renderExtra(body, r.hits, r.fileCount);
        card.appendChild(body);
        healthResult.appendChild(card);
      }
    }

    function buildSummary(fileHitCount) {
      const summary = document.createElement('div');
      summary.className = 'scan-summary';
      const dist = Object.entries(fileHitCount)
        .sort((a, b) => b[1] - a[1])
        .map(([k, v]) => `${k.split('/').pop()} (${v})`)
        .join('  ');
      summary.textContent = '命中分布：' + (dist || '—');
      return summary;
    }
    function moreRow(colspan, count) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td colspan="${colspan}" class="hit-more">…省略 ${count} 条</td>`;
      return tr;
    }

    // 1. 阿拉伯数字
    function renderDigit(container, hits, fileHitCount) {
      container.appendChild(buildSummary(fileHitCount));
      const table = document.createElement('table');
      table.className = 'hit-table';
      table.innerHTML = `<thead><tr><th style="width:2.5rem">#</th><th>文件</th><th style="width:3rem">字幕#</th><th style="width:13rem">时间轴</th><th style="width:4rem">数字</th><th>上下文</th></tr></thead><tbody></tbody>`;
      const tbody = table.querySelector('tbody');
      const limit = 500;
      const showCount = Math.min(hits.length, limit);
      for (let i = 0; i < showCount; i++) {
        const h = hits[i];
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${i + 1}</td><td class="hit-fname" title="${escapeHtmlAttr(h.fileName)}">${escapeHtml(h.fileName.split('/').pop())}</td><td>${h.subIdx}</td><td>${formatTimecode(h.start)} → ${formatTimecode(h.end)}</td><td class="digit-value">${escapeHtml(h.digit)}</td><td class="hit-ctx">${highlightDigit(h.text, h.digitStart, h.digit.length)}</td>`;
        tbody.appendChild(tr);
      }
      if (hits.length > limit) tbody.appendChild(moreRow(6, hits.length - limit));
      container.appendChild(table);
    }

    // 2. 超长时间轴
    function renderLongaxis(container, hits, fileHitCount) {
      container.appendChild(buildSummary(fileHitCount));
      const table = document.createElement('table');
      table.className = 'hit-table';
      table.innerHTML = `<thead><tr><th style="width:2.5rem">#</th><th>文件</th><th style="width:3rem">字幕#</th><th style="width:13rem">时间轴</th><th style="width:5.5rem">时长</th><th style="width:3.5rem">包含</th><th>本句内容</th></tr></thead><tbody></tbody>`;
      const tbody = table.querySelector('tbody');
      const limit = 500;
      const showCount = Math.min(hits.length, limit);
      for (let i = 0; i < showCount; i++) {
        const h = hits[i];
        const tr = document.createElement('tr');
        tr.className = 'long-row';
        tr.innerHTML = `<td>${i + 1}</td><td class="hit-fname" title="${escapeHtmlAttr(h.fileName)}">${escapeHtml(h.fileName.split('/').pop())}</td><td>${h.subIdx}</td><td>${formatTimecode(h.start)} → ${formatTimecode(h.end)}</td><td class="long-dur">${formatDuration(h.duration)}</td><td class="long-count">${h.contained.length}</td><td class="hit-ctx">${escapeHtml(h.text)}</td>`;
        tbody.appendChild(tr);
        const detailTr = document.createElement('tr');
        detailTr.className = 'long-contained-row';
        const items = h.contained.map(c => `<div class="long-contained-item"><span class="long-contained-idx">#${c.subIdx}</span><span class="long-contained-tc">${formatTimecode(c.start)} → ${formatTimecode(c.end)}</span><span class="long-contained-text">${escapeHtml(truncate(c.text, 60))}</span></div>`).join('');
        detailTr.innerHTML = `<td colspan="7"><div class="long-contained">被包含的字幕：${items}</div></td>`;
        tbody.appendChild(detailTr);
      }
      if (hits.length > limit) tbody.appendChild(moreRow(7, hits.length - limit));
      container.appendChild(table);
    }

    // 3. 时间轴倒退
    function renderReverse(container, hits, fileHitCount) {
      container.appendChild(buildSummary(fileHitCount));
      const table = document.createElement('table');
      table.className = 'hit-table';
      table.innerHTML = `<thead><tr><th style="width:2.5rem">#</th><th>文件</th><th style="width:3rem">字幕#</th><th style="width:13rem">时间轴</th><th style="width:5.5rem">差值</th><th>本句内容</th></tr></thead><tbody></tbody>`;
      const tbody = table.querySelector('tbody');
      const limit = 500;
      const showCount = Math.min(hits.length, limit);
      for (let i = 0; i < showCount; i++) {
        const h = hits[i];
        const tr = document.createElement('tr');
        tr.className = 'reverse-row';
        tr.innerHTML = `<td>${i + 1}</td><td class="hit-fname" title="${escapeHtmlAttr(h.fileName)}">${escapeHtml(h.fileName.split('/').pop())}</td><td>${h.subIdx}</td><td>${formatTimecode(h.start)} → ${formatTimecode(h.end)}</td><td class="long-dur">${h.duration}ms</td><td class="hit-ctx">${escapeHtml(h.text)}</td>`;
        tbody.appendChild(tr);
      }
      if (hits.length > limit) tbody.appendChild(moreRow(6, hits.length - limit));
      container.appendChild(table);
    }

    // 4. 时间轴重叠
    function renderOverlap(container, hits, fileHitCount) {
      container.appendChild(buildSummary(fileHitCount));
      const table = document.createElement('table');
      table.className = 'hit-table';
      table.innerHTML = `<thead><tr><th style="width:2.5rem">#</th><th>文件</th><th style="width:3.5rem">A#</th><th style="width:3.5rem">B#</th><th style="width:13rem">A 时间轴</th><th style="width:13rem">B 时间轴</th><th style="width:5rem">重叠</th><th>内容</th></tr></thead><tbody></tbody>`;
      const tbody = table.querySelector('tbody');
      const limit = 500;
      const showCount = Math.min(hits.length, limit);
      for (let i = 0; i < showCount; i++) {
        const h = hits[i];
        const tr = document.createElement('tr');
        tr.className = 'overlap-row';
        tr.innerHTML = `<td>${i + 1}</td><td class="hit-fname" title="${escapeHtmlAttr(h.fileName)}">${escapeHtml(h.fileName.split('/').pop())}</td><td>${h.subIdxA}</td><td>${h.subIdxB}</td><td>${formatTimecode(h.startA)} → ${formatTimecode(h.endA)}</td><td>${formatTimecode(h.startB)} → ${formatTimecode(h.endB)}</td><td class="long-dur">${formatDuration(h.overlapMs)}</td><td class="hit-ctx">${escapeHtml(truncate(h.textA, 40))} → ${escapeHtml(truncate(h.textB, 40))}</td>`;
        tbody.appendChild(tr);
      }
      if (hits.length > limit) tbody.appendChild(moreRow(8, hits.length - limit));
      container.appendChild(table);
    }

    // 5. 空文本
    function renderEmpty(container, hits, fileHitCount) {
      container.appendChild(buildSummary(fileHitCount));
      const table = document.createElement('table');
      table.className = 'hit-table';
      table.innerHTML = `<thead><tr><th style="width:2.5rem">#</th><th>文件</th><th style="width:3rem">字幕#</th><th style="width:13rem">时间轴</th><th style="width:5.5rem">时长</th></tr></thead><tbody></tbody>`;
      const tbody = table.querySelector('tbody');
      const limit = 500;
      const showCount = Math.min(hits.length, limit);
      for (let i = 0; i < showCount; i++) {
        const h = hits[i];
        const tr = document.createElement('tr');
        tr.className = 'empty-row';
        tr.innerHTML = `<td>${i + 1}</td><td class="hit-fname" title="${escapeHtmlAttr(h.fileName)}">${escapeHtml(h.fileName.split('/').pop())}</td><td>${h.subIdx}</td><td>${formatTimecode(h.start)} → ${formatTimecode(h.end)}</td><td class="long-dur">${formatDuration(h.end - h.start)}</td>`;
        tbody.appendChild(tr);
      }
      if (hits.length > limit) tbody.appendChild(moreRow(5, hits.length - limit));
      container.appendChild(table);
    }

    // 6. 重复块
    function renderDup(container, hits, fileHitCount) {
      container.appendChild(buildSummary(fileHitCount));
      const table = document.createElement('table');
      table.className = 'hit-table';
      table.innerHTML = `<thead><tr><th style="width:2.5rem">#</th><th>文件</th><th style="width:5rem">重复数</th><th style="width:13rem">时间轴</th><th>字幕#</th><th>内容</th></tr></thead><tbody></tbody>`;
      const tbody = table.querySelector('tbody');
      const limit = 500;
      const showCount = Math.min(hits.length, limit);
      for (let i = 0; i < showCount; i++) {
        const h = hits[i];
        const tr = document.createElement('tr');
        tr.className = 'dup-row';
        tr.innerHTML = `<td>${i + 1}</td><td class="hit-fname" title="${escapeHtmlAttr(h.fileName)}">${escapeHtml(h.fileName.split('/').pop())}</td><td class="long-count">${h.count}</td><td>${formatTimecode(h.start)} → ${formatTimecode(h.end)}</td><td>${h.subIdxs.join(', ')}</td><td class="hit-ctx">${escapeHtml(truncate(h.text, 60))}</td>`;
        tbody.appendChild(tr);
      }
      if (hits.length > limit) tbody.appendChild(moreRow(6, hits.length - limit));
      container.appendChild(table);
    }

    // 7. A 时间轴缺失（B 有 A 无）
    function renderMissing(container, hits, fileHitCount) {
      container.appendChild(buildSummary(fileHitCount));
      const table = document.createElement('table');
      table.className = 'hit-table';
      table.innerHTML = `<thead><tr><th style="width:2.5rem">#</th><th>文件（A）</th><th style="width:5rem">B 字幕#</th><th style="width:13rem">B 时间轴</th><th>B 内容</th><th style="width:8rem">原因</th></tr></thead><tbody></tbody>`;
      const tbody = table.querySelector('tbody');
      const limit = 500;
      const showCount = Math.min(hits.length, limit);
      for (let i = 0; i < showCount; i++) {
        const h = hits[i];
        const tr = document.createElement('tr');
        tr.className = 'reverse-row';
        const reason = h.reason || 'A 中无对应覆盖';
        tr.innerHTML = `<td>${i + 1}</td><td class="hit-fname" title="${escapeHtmlAttr(h.fileName)}">${escapeHtml(h.fileName.split('/').pop())}</td><td>#${h.bSubIdx}</td><td>${formatTimecode(h.start)} → ${formatTimecode(h.end)}</td><td class="hit-ctx">${escapeHtml(truncate(h.text, 50))}</td><td class="hit-reason">${escapeHtml(reason)}</td>`;
        tbody.appendChild(tr);
      }
      if (hits.length > limit) tbody.appendChild(moreRow(6, hits.length - limit));
      container.appendChild(table);
    }

    // 8. A 时间轴多余（A 有 B 无）
    function renderExtra(container, hits, fileHitCount) {
      container.appendChild(buildSummary(fileHitCount));
      const table = document.createElement('table');
      table.className = 'hit-table';
      table.innerHTML = `<thead><tr><th style="width:2.5rem">#</th><th>文件（A）</th><th style="width:3rem">A#</th><th style="width:13rem">A 时间轴</th><th>A 内容</th><th style="width:8rem">原因</th></tr></thead><tbody></tbody>`;
      const tbody = table.querySelector('tbody');
      const limit = 500;
      const showCount = Math.min(hits.length, limit);
      for (let i = 0; i < showCount; i++) {
        const h = hits[i];
        const tr = document.createElement('tr');
        tr.className = 'overlap-row';
        const reason = h.reason || 'B 中无对应时间轴';
        tr.innerHTML = `<td>${i + 1}</td><td class="hit-fname" title="${escapeHtmlAttr(h.fileName)}">${escapeHtml(h.fileName.split('/').pop())}</td><td>${h.subIdx}</td><td>${formatTimecode(h.start)} → ${formatTimecode(h.end)}</td><td class="hit-ctx">${escapeHtml(truncate(h.text, 50))}</td><td class="hit-reason">${escapeHtml(reason)}</td>`;
        tbody.appendChild(tr);
      }
      if (hits.length > limit) tbody.appendChild(moreRow(6, hits.length - limit));
      container.appendChild(table);
    }

    // ------- 工具函数（供健康检查 render 复用） -------
    function flattenText(text) {
      return String(text || '').replace(/\r\n/g, '\n').replace(/\n/g, ' ').trim();
    }
    function truncate(s, n) {
      return s.length > n ? s.slice(0, n) + '…' : s;
    }
    function formatDuration(ms) {
      const totalSec = ms / 1000;
      if (totalSec < 60) return totalSec.toFixed(2) + 's';
      const m = Math.floor(totalSec / 60);
      const s = (totalSec - m * 60).toFixed(2);
      return `${m}m${s.padStart(5, '0')}s`;
    }

    function highlightDigit(text, start, len) {
      const safe = escapeHtml(text);
      // 重建索引：escapeHtml 不改变 ASCII 字符位置（\d < 128 安全）
      return safe.slice(0, start)
        + `<mark>${safe.slice(start, start + len)}</mark>`
        + safe.slice(start + len);
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function escapeHtmlAttr(s) {
      return escapeHtml(s).replace(/"/g, '&quot;');
    }
    // 注意：formatTimecode 直接复用 srt.js 的全局实现，切勿在此重定义（同名全局函数会覆盖 srt.js 版本，导致 generateSrt 输出错误时间轴）
  </script>
</body>
</html>
